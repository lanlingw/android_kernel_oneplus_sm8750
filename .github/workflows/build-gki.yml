name: Build GKI Kernel (OnePlus SM8750)

# 使用 OnePlus 官方 kernel_manifest 仓库拉取完整编译工作区。
# Manifest 包含 3 个 OnePlus 仓库 + CodeLinaro QCOM 依赖：
#   - android_kernel_common_oneplus_sm8750  → kernel_platform/common/   (GKI 通用内核)
#   - android_kernel_oneplus_sm8750         → kernel_platform/msm-kernel/ (MSM 设备内核)
#   - android_kernel_modules_and_devicetree_oneplus_sm8750 → ./ (模块和设备树)
#
# 工作区结构（repo sync 后）：
#   android-kernel/
#   ├── WORKSPACE / tools/bazel    ← Bazel 工作区（来自 modules 仓库）
#   ├── kernel_platform/
#   │   ├── common/                ← GKI 通用内核
#   │   ├── msm-kernel/            ← MSM 设备内核（含 pineapple 平台配置）
#   │   ├── build/                 ← Bazel 编译规则
#   │   ├── prebuilts/             ← 工具链（clang/rust/jdk 等）
#   │   └── external/              ← 外部依赖
#   └── ...

on:
  workflow_dispatch:
    inputs:
      manifest_file:
        description: '选择设备和 Android 版本（manifest 文件）'
        required: true
        default: 'oneplus_pad_2_pro_b.xml'
        type: choice
        options:
          - oneplus_pad_2_pro_b.xml
          - oneplus_pad_2_pro.xml
          - oneplus_13_b.xml
          - oneplus_13.xml
          - oneplus_13s_b.xml
          - oneplus_13t_b.xml
          - oneplus_ace5_pro_b.xml
          - oneplus_pad_3.xml
      build_target:
        description: '编译目标（GKI 通用内核 或 设备专属内核）'
        required: true
        default: 'gki'
        type: choice
        options:
          - gki
          - pineapple
      custom_configs:
        description: '自定义内核配置（每行一个，如 CONFIG_PID_NS=y）。留空则使用默认配置。'
        required: false
        default: ''
        type: string

env:
  MANIFEST_URL: https://github.com/OnePlusOSS/kernel_manifest
  MANIFEST_BRANCH: oneplus/sm8750
  WORKSPACE: android-kernel

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. 释放磁盘空间
      # ============================================================
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Check available resources
        run: |
          echo "=== 磁盘空间 ==="
          df -h /
          echo "CPU: $(nproc) 核 | 内存: $(free -h | awk '/^Mem:/{print $2}')"

      # ============================================================
      # 2. 解析参数
      # ============================================================
      - name: Resolve parameters
        id: params
        run: |
          MANIFEST_FILE="${{ github.event.inputs.manifest_file || 'oneplus_pad_2_pro_b.xml' }}"
          BUILD_TARGET="${{ github.event.inputs.build_target || 'gki' }}"

          MANIFEST_NAME="${MANIFEST_FILE%.xml}"

          echo "manifest_file=$MANIFEST_FILE" >> $GITHUB_OUTPUT
          echo "manifest_name=$MANIFEST_NAME" >> $GITHUB_OUTPUT
          echo "build_target=$BUILD_TARGET" >> $GITHUB_OUTPUT

          # 根据编译目标设置 Bazel target
          if [ "$BUILD_TARGET" = "gki" ]; then
            BAZEL_TARGET="//kernel_platform/common:kernel_aarch64_dist"
          else
            BAZEL_TARGET="//kernel_platform/msm-kernel:pineapple_dist"
          fi
          echo "bazel_target=$BAZEL_TARGET" >> $GITHUB_OUTPUT

          echo "=== 编译参数 ==="
          echo "Manifest 文件:  $MANIFEST_FILE"
          echo "编译目标:       $BUILD_TARGET"
          echo "Bazel target:   $BAZEL_TARGET"

      # ============================================================
      # 3. 安装编译依赖 + repo 工具
      # ============================================================
      - name: Install build dependencies and repo tool
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex git \
            libncurses-dev libssl-dev libelf-dev \
            python3 python3-pip python-is-python3 \
            zip unzip wget curl lz4 ccache \
            openjdk-17-jdk-headless dwarves zstd \
            libxml2-utils

          # 安装 Google repo 工具
          sudo curl -o /usr/local/bin/repo \
            https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          echo "=== 工具版本 ==="
          repo version
          gcc --version | head -1
          python3 --version

      # ============================================================
      # 4. 初始化 repo manifest（OnePlus 官方 manifest）
      #    使用 -m 指定设备专属 manifest 文件
      # ============================================================
      - name: Initialize repo manifest
        run: |
          mkdir -p ${{ env.WORKSPACE }}
          cd ${{ env.WORKSPACE }}

          repo init -u ${{ env.MANIFEST_URL }} \
            -b ${{ env.MANIFEST_BRANCH }} \
            -m ${{ steps.params.outputs.manifest_file }} \
            --depth 1

          echo "=== Manifest: ${{ steps.params.outputs.manifest_file }} ==="
          echo "=== 分支: ${{ env.MANIFEST_BRANCH }} ==="

      # ============================================================
      # 5. 同步源码
      #    包含 OnePlus 3 个仓库 + CodeLinaro QCOM 依赖
      #    CodeLinaro 可能较慢，先全量同步再重试失败的项目
      # ============================================================
      - name: Sync source code
        run: |
          cd ${{ env.WORKSPACE }}

          echo "=== 第一次同步（全量）==="
          repo sync -c --no-tags --no-clone-bundle -j$(nproc) || true

          echo ""
          echo "=== 第二次同步（重试失败项目）==="
          repo sync -c --no-tags --no-clone-bundle -j4

          echo ""
          echo "=== 同步完成，工作区结构 ==="
          ls -la | head -25
          echo ""
          echo "=== kernel_platform/ 目录 ==="
          ls kernel_platform/ 2>/dev/null | head -20
          echo ""
          echo "=== kernel_platform/common/ 前 15 项 ==="
          ls kernel_platform/common/ 2>/dev/null | head -15
          echo ""
          echo "=== kernel_platform/msm-kernel/ 前 15 项 ==="
          ls kernel_platform/msm-kernel/ 2>/dev/null | head -15
          echo ""
          echo "=== 磁盘使用 ==="
          du -sh . 2>/dev/null
          df -h /

      # ============================================================
      # 6. 缓存 ccache
      # ============================================================
      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ steps.params.outputs.build_target }}-${{ steps.params.outputs.manifest_file }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.params.outputs.build_target }}-${{ steps.params.outputs.manifest_file }}-

      # ============================================================
      # 7. 应用自定义内核配置
      #    使用 merge_config.sh 将自定义配置合并到 defconfig 中
      #    这是最可靠的方式，避免 Bazel 沙箱和 label 问题
      # ============================================================
      - name: Apply custom kernel configs
        run: |
          cd ${{ env.WORKSPACE }}
          CUSTOM_CONFIGS="${{ github.event.inputs.custom_configs }}"

          if [ -z "$CUSTOM_CONFIGS" ]; then
            echo "无自定义配置，使用默认内核配置"
            exit 0
          fi

          BUILD_TARGET="${{ steps.params.outputs.build_target }}"
          echo "=== 自定义内核配置 ==="
          echo "$CUSTOM_CONFIGS"
          echo ""

          # 确定内核源码目录和 defconfig 文件
          if [ "$BUILD_TARGET" = "gki" ]; then
            KERNEL_DIR="kernel_platform/common"
            DEFCONFIG_NAME="gki_defconfig"
          else
            KERNEL_DIR="kernel_platform/msm-kernel"
            DEFCONFIG_NAME="pineapple_defconfig"
          fi

          DEFCONFIG_FILE="$KERNEL_DIR/arch/arm64/configs/$DEFCONFIG_NAME"
          FRAGMENT_FILE="$KERNEL_DIR/user_custom.config"

          if [ ! -f "$DEFCONFIG_FILE" ]; then
            echo "错误: defconfig 文件不存在: $DEFCONFIG_FILE"
            echo "可用的 defconfig 文件:"
            find "$KERNEL_DIR/arch/arm64/configs/" -name "*_defconfig" 2>/dev/null | head -10
            exit 1
          fi

          # 1. 创建配置片段文件（支持逗号、分号、换行分隔）
          echo "=== 创建配置片段: $FRAGMENT_FILE ==="
          echo "$CUSTOM_CONFIGS" | tr ',;' '\n\n' | sed '/^[[:space:]]*$/d' > "$FRAGMENT_FILE"
          echo "片段内容:"
          cat "$FRAGMENT_FILE"
          echo ""

          # 2. 合并配置到 defconfig
          # 最简单可靠的方式：直接追加自定义配置到 defconfig 文件末尾
          # 内核编译时的 olddefconfig 步骤会处理依赖关系
          echo "=== 合并配置到 $DEFCONFIG_FILE ==="
          
          # 备份原始 defconfig
          cp "$DEFCONFIG_FILE" "$DEFCONFIG_FILE.bak"
          
          # 追加自定义配置
          echo "" >> "$DEFCONFIG_FILE"
          echo "# Custom user configurations (auto-generated)" >> "$DEFCONFIG_FILE"
          cat "$FRAGMENT_FILE" >> "$DEFCONFIG_FILE"
          
          echo "已追加自定义配置到 defconfig"
          
          echo ""
          echo "=== 合并后的配置差异 ==="
          diff "$DEFCONFIG_FILE.bak" "$DEFCONFIG_FILE" | grep "^[<>]" | head -20 || echo "无差异"
          
          rm -f "$DEFCONFIG_FILE.bak"
          
          # 3. 验证关键配置
          echo ""
          echo "=== 验证自定义配置是否已合并 ==="
          echo "$CUSTOM_CONFIGS" | tr ',;' '\n\n' | sed '/^[[:space:]]*$/d' | while IFS='=' read -r key val; do
            [ -z "$key" ] && continue
            key=$(echo "$key" | tr -d '[:space:]')
            val=$(echo "$val" | tr -d '[:space:]')
            if grep -q "^${key}=${val}$" "$DEFCONFIG_FILE"; then
              echo "  ✓ $key=$val"
            else
              echo "  ✗ $key=$val (未找到或值不同)"
              grep "^${key}=" "$DEFCONFIG_FILE" | head -1 || echo "    配置项不存在"
            fi
          done
          
          # 4. 清理备份
          rm -f "$DEFCONFIG_FILE.bak" "$FRAGMENT_FILE"
          
          echo ""
          echo "=== 自定义配置已成功合并到 defconfig ==="

      # ============================================================
      # 8. 编译内核
      #    使用 Kleaf (Bazel) 编译系统
      # ============================================================
      - name: Build kernel
        run: |
          cd ${{ env.WORKSPACE }}

          export CCACHE_DIR="$HOME/.ccache"
          export PATH="/usr/lib/ccache:$PATH"

          ccache -M 20G 2>/dev/null || true
          ccache -z 2>/dev/null || true

          echo "========================================"
          echo "  内核编译"
          echo "========================================"
          echo "Manifest:       ${{ steps.params.outputs.manifest_file }}"
          echo "编译目标:       ${{ steps.params.outputs.build_target }}"
          echo "Bazel target:   ${{ steps.params.outputs.bazel_target }}"
          echo "编译并发数:     $(nproc)"
          echo "========================================"
          echo ""

          # 诊断：查找 tools/bazel 位置
          echo "=== 查找 tools/bazel ==="
          find . -name "bazel" -path "*/tools/*" -type f 2>/dev/null | head -5

          # 查找 Bazel 并确定工作区根目录（含 WORKSPACE 文件的目录）
          BAZEL=""
          BAZEL_ROOT=""
          for candidate in tools/bazel kernel_platform/tools/bazel; do
            if [ -f "$candidate" ]; then
              BAZEL="$candidate"
              # 工作区根目录 = tools/bazel 的上两级
              BAZEL_ROOT=$(dirname "$(dirname "$candidate")")
              break
            fi
          done

          if [ -z "$BAZEL" ]; then
            BAZEL=$(find . -name "bazel" -type f -executable 2>/dev/null | head -1)
            if [ -n "$BAZEL" ]; then
              BAZEL_ROOT=$(dirname "$(dirname "$BAZEL")")
            fi
          fi

          # 查找 WORKSPACE 文件确认工作区根目录
          echo "=== 查找 WORKSPACE 文件 ==="
          find . -maxdepth 3 -name "WORKSPACE" -o -name "WORKSPACE.bazel" 2>/dev/null | grep -v ".repo" | head -5

          if [ -n "$BAZEL" ]; then
            echo "=== 找到 Bazel: $BAZEL (根目录: $BAZEL_ROOT) ==="
            chmod +x "$BAZEL" 2>/dev/null || true

            # 切换到 Bazel 工作区根目录（Bazel 需从含 WORKSPACE 的目录运行）
            cd "$BAZEL_ROOT"

            # 调整 target 路径：如果工作区根是 kernel_platform/，
            # 则 //kernel_platform/common:... → //common:...
            TARGET="${{ steps.params.outputs.bazel_target }}"
            if [ "$BAZEL_ROOT" = "kernel_platform" ]; then
              TARGET=$(echo "$TARGET" | sed 's|//kernel_platform/|//|')
            fi

            echo "=== 工作目录: $(pwd) ==="
            echo "=== Bazel: $(basename $BAZEL_ROOT)/$BAZEL → 实际路径: $BAZEL ==="
            echo "=== 编译 target: $TARGET ==="
            echo ""

            # 使用相对于工作区根目录的 bazel 路径
            BAZEL_REL="tools/bazel"
            "$BAZEL_REL" build --config=fast "$TARGET"

          elif [ -f "kernel_platform/build_with_bazel.py" ]; then
            echo "=== 使用 build_with_bazel.py 编译 ==="
            cd kernel_platform
            python3 build_with_bazel.py --target ${{ steps.params.outputs.build_target }}
          else
            echo "错误: 找不到 Bazel 编译工具"
            echo "搜索所有 bazel 相关文件:"
            find . -name "*bazel*" -type f 2>/dev/null | head -10
            exit 1
          fi

          echo ""
          echo "=== 编译完成 ==="
          ccache -s 2>/dev/null || true

      # ============================================================
      # 8. 验证内核配置
      #    检查自定义配置是否生效
      # ============================================================
      - name: Verify kernel config
        if: always()
        run: |
          cd ${{ env.WORKSPACE }}
          CUSTOM_CONFIGS="${{ github.event.inputs.custom_configs }}"

          echo "=== 查找编译生成的 .config ==="
          find . -name ".config" -not -path "*/.repo/*" 2>/dev/null | head -10
          echo ""

          # 找到实际的 .config 文件
          CONFIG_FILE=$(find . -name ".config" -not -path "*/.repo/*" \
            -not -path "*/cache/*" 2>/dev/null | head -1)

          if [ -z "$CONFIG_FILE" ]; then
            echo "警告: 未找到 .config 文件"
            # 搜索 defconfig
            echo "搜索 defconfig 文件:"
            find . -name "*.config" -path "*/out/*" -not -path "*/.repo/*" 2>/dev/null | head -10
            CONFIG_FILE=$(find . -name "defconfig" -path "*/out/*" -not -path "*/.repo/*" 2>/dev/null | head -1)
          fi

          if [ -n "$CONFIG_FILE" ]; then
            echo "=== .config 文件: $CONFIG_FILE ==="
            echo "文件大小: $(wc -l < "$CONFIG_FILE") 行"
            echo ""

            # 检查自定义配置
            if [ -n "$CUSTOM_CONFIGS" ]; then
              echo "=== 检查自定义配置是否生效 ==="
              echo "$CUSTOM_CONFIGS" | tr ',;' '\n\n' | sed '/^[[:space:]]*$/d' | while IFS='=' read -r key val; do
                [ -z "$key" ] && continue
                key=$(echo "$key" | tr -d '[:space:]')
                val=$(echo "$val" | tr -d '[:space:]')
                echo "  检查: $key=$val"
                grep -i "${key#CONFIG_}" "$CONFIG_FILE" 2>/dev/null | head -3 || \
                  echo "    未找到 $key"
              done
            fi

            echo ""
            echo "=== 关键命名空间配置 ==="
            grep -i "PID_NS\|IPC_NS\|USER_NS\|NET_NS\|UTS_NS\|NAMESPACES" "$CONFIG_FILE" 2>/dev/null || \
              echo "未找到命名空间相关配置"
          else
            echo "错误: 未找到任何 .config 文件"
          fi

      # ============================================================
      # 9. 收集编译产物
      #    Bazel 输出可能在 out/bazel/output/ 或 kernel_platform/out/
      # ============================================================
      - name: Collect build artifacts
        if: always()
        run: |
          cd ${{ env.WORKSPACE }}
          mkdir -p artifacts

          echo "=== 查找产物目录 ==="
          find . -type d \( -name "dist" -o -name "output" \) 2>/dev/null | grep -v ".repo" | head -20
          echo ""

          # 搜索所有可能的产物目录
          DIST_DIR=""
          for candidate in \
            out/bazel/output \
            kernel_platform/out/bazel/output \
            out/dist \
            kernel_platform/out/dist \
            out/android15-6.6/dist; do
            if [ -d "$candidate" ] && [ "$(ls -A $candidate 2>/dev/null)" ]; then
              DIST_DIR="$candidate"
              break
            fi
          done

          # 回退：搜索任意 dist/output 目录
          if [ -z "$DIST_DIR" ]; then
            DIST_DIR=$(find . \( -name "dist" -o -name "output" \) -type d 2>/dev/null | \
              grep -v ".repo" | head -1)
          fi
          if [ -z "$DIST_DIR" ]; then
            echo "未找到产物目录"
            DIST_DIR="out"
          fi

          echo "=== 产物目录: $DIST_DIR ==="
          ls -lh "$DIST_DIR/" 2>/dev/null | head -40
          echo ""

          # 复制内核镜像
          echo "=== 收集内核镜像 ==="
          for f in Image Image.gz Image.lz4 Image.gz-dtb vmlinux vmlinux.symvers System.map; do
            find "$DIST_DIR" -name "$f" -exec cp -v {} artifacts/ \; 2>/dev/null
          done

          # 复制模块信息
          for f in modules.builtin modules.builtin.modinfo modules.order modules.dep; do
            find "$DIST_DIR" -name "$f" -exec cp -v {} artifacts/ \; 2>/dev/null
          done

          # 复制 .config
          find . -name ".config" -not -path "*/.repo/*" \
            -exec cp -v {} artifacts/kernel.config \; 2>/dev/null

          # 复制内核模块
          echo "=== 收集内核模块 (*.ko) ==="
          MODULE_COUNT=$(find "$DIST_DIR" -name "*.ko" 2>/dev/null | wc -l)
          echo "找到 $MODULE_COUNT 个内核模块"
          if [ "$MODULE_COUNT" -gt 0 ] && [ "$MODULE_COUNT" -le 500 ]; then
            find "$DIST_DIR" -name "*.ko" -exec cp -v {} artifacts/ \; 2>/dev/null
          elif [ "$MODULE_COUNT" -gt 500 ]; then
            find "$DIST_DIR" -name "*.ko" | tar -czf artifacts/kernel-modules.tar.gz -T -
          fi

          # 复制分发包
          find "$DIST_DIR" -name "*.tar.gz" -exec cp -v {} artifacts/ \; 2>/dev/null

          # 复制 boot.img 等
          for f in boot-gki.img boot.img vendor_boot.img vbmeta.img system_dlkm.img; do
            find . -name "$f" -not -path "*/.repo/*" -exec cp -v {} artifacts/ \; 2>/dev/null
          done

          echo ""
          echo "=== 最终产物列表 ==="
          ls -lh artifacts/ 2>/dev/null
          echo "总大小: $(du -sh artifacts/ 2>/dev/null | cut -f1)"

      # ============================================================
      # 9. 上传编译产物
      # ============================================================
      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.params.outputs.build_target }}-${{ steps.params.outputs.manifest_name }}
          path: ${{ env.WORKSPACE }}/artifacts/
          retention-days: 14
          compression-level: 6

      # ============================================================
      # 10. 编译摘要
      # ============================================================
      - name: Generate build summary
        if: always()
        run: |
          echo "## 内核编译摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Manifest | \`${{ steps.params.outputs.manifest_file }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 编译目标 | \`${{ steps.params.outputs.build_target }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Bazel target | \`${{ steps.params.outputs.bazel_target }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 架构 | aarch64 |" >> $GITHUB_STEP_SUMMARY
          echo "| 运行时间 | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

          CUSTOM_CONFIGS="${{ github.event.inputs.custom_configs }}"
          if [ -n "$CUSTOM_CONFIGS" ]; then
            echo "| 自定义配置 | 已应用 |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 自定义内核配置" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$CUSTOM_CONFIGS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "| 自定义配置 | 无（默认配置） |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          ARTIFACTS_DIR="${{ env.WORKSPACE }}/artifacts"
          if [ -d "$ARTIFACTS_DIR" ] && [ "$(ls -A $ARTIFACTS_DIR 2>/dev/null)" ]; then
            echo "### 产物列表" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| 文件 | 大小 |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            ls -lh "$ARTIFACTS_DIR/" | tail -n +2 | \
              awk '{print "| `" $NF "` | " $5 " |"}' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "总大小: **$(du -sh $ARTIFACTS_DIR | cut -f1)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ 编译失败或无产物" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "请检查 Actions 日志排查错误。" >> $GITHUB_STEP_SUMMARY
          fi
