name: Build OnePlus Pad 2 Pro Droidspaces GKI Kernel

on:
  workflow_dispatch:
    inputs:
      TARGET:
        description: "OnePlus Qualcomm platform target"
        required: false
        type: string
        default: "sun"
      VARIANT:
        description: "Kernel build variant"
        required: false
        type: choice
        options:
          - gki
          - perf
          - debug
        default: "gki"
      APPLY_OPTIONAL_CONFIG:
        description: "Enable optional/recommended Droidspaces GKI configs"
        required: false
        type: boolean
        default: false
      CLEAN_BUILD:
        description: "Clean kernel output before build"
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: >
      OnePlus Pad 2 Pro SM8750
      ${{ inputs.TARGET || 'sun' }}-${{ inputs.VARIANT || 'gki' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    env:
      # ============================================================
      # Build parameters
      # ============================================================
      TARGET: ${{ inputs.TARGET || 'sun' }}
      VARIANT: ${{ inputs.VARIANT || 'gki' }}

      # IMPORTANT: Always use absolute path
      WORKSPACE: ${{ github.workspace }}/kernel_workspace

      # Official OnePlus manifest
      MANIFEST_BRANCH: oneplus/sm8750
      MANIFEST_FILE: oneplus_pad_2_pro_b.xml

      # Build parallelism
      BUILD_JOBS: 8

      # ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G

    steps:
      # ============================================================
      # 1. Maximize GitHub Actions disk space
      # ============================================================
      - name: "🚀 Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: "📦 Install Build Dependencies"
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python-is-python3 \
            git \
            curl \
            wget \
            ccache \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            zlib1g-dev \
            rsync \
            unzip \
            gawk \
            dos2unix \
            bc \
            libelf-dev \
            pkg-config \
            gcc-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            openjdk-17-jdk \
            android-sdk-libsparse-utils \
            lib32z1-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            xsltproc \
            yasm \
            cpio \
            repo

          echo
          echo "========================================"
          echo "Tool versions"
          echo "========================================"
          python3 --version
          git --version
          repo --version || true
          clang --version
          ld.lld --version
          ccache --version
          echo
          echo "Java:"
          java -version || true

      # ============================================================
      # 3. Configure ccache
      # ============================================================
      - name: "⚡ Configure ccache"
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --show-config

      # ============================================================
      # 4. Restore ccache
      # ============================================================
      - name: "📦 Restore ccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: >
            ccache-sm8750-pad2pro-
            ${{ env.TARGET }}-
            ${{ env.VARIANT }}-
            ${{ hashFiles('.github/workflows/**') }}
          restore-keys: |
            ccache-sm8750-pad2pro-${{ env.TARGET }}-${{ env.VARIANT }}-
            ccache-sm8750-pad2pro-${{ env.TARGET }}-
            ccache-sm8750-pad2pro-

      # ============================================================
      # 5. Initialize official OnePlus manifest
      # ============================================================
      - name: "📥 Init Official OnePlus SM8750 Manifest"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          echo "WORKSPACE (absolute): $WORKSPACE"

          echo "========================================"
          echo "OnePlus Kernel Source"
          echo "========================================"
          echo "Workspace      : $WORKSPACE"
          echo "Manifest branch: $MANIFEST_BRANCH"
          echo "Manifest file  : $MANIFEST_FILE"
          echo "Target         : $TARGET"
          echo "Variant        : $VARIANT"

          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b "$MANIFEST_BRANCH" \
            -m "$MANIFEST_FILE" \
            --depth=1

      # ============================================================
      # 6. Sync source tree
      # ============================================================
      - name: "📥 Sync OnePlus Kernel Source"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          cd "$WORKSPACE"

          repo sync \
            -c \
            -j"$(nproc --all)" \
            --no-tags \
            --no-clone-bundle \
            --force-sync

          echo
          echo "========================================"
          echo "Repo status"
          echo "========================================"
          repo status || true

          echo
          echo "========================================"
          echo "Kernel platform"
          echo "========================================"
          ls -lah "$WORKSPACE/kernel_platform"

          echo
          echo "========================================"
          echo "Early path verification"
          echo "========================================"
          test -d "$WORKSPACE/kernel_platform/common"
          test -f "$WORKSPACE/kernel_platform/common/arch/arm64/configs/gki_defconfig"
          echo "✅ gki_defconfig exists"

      # ============================================================
      # 7. Verify OnePlus build environment
      # ============================================================
      - name: "🔎 Verify SM8750 Build Environment"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          ROOT="$WORKSPACE/kernel_platform"

          test -d "$ROOT"
          test -d "$ROOT/common"

          echo "Kernel platform:"
          echo "$ROOT"
          echo

          echo "========================================"
          echo "Expected files"
          echo "========================================"

          if [ -f "$ROOT/oplus/build/oplus_build_kernel.sh" ]; then
            echo "✅ OPLUS build wrapper found"
          else
            echo "❌ OPLUS build wrapper NOT found"
            exit 1
          fi

          if [ -f "$ROOT/common/arch/arm64/configs/gki_defconfig" ]; then
            echo "✅ gki_defconfig found"
          else
            echo "❌ gki_defconfig NOT found"
            exit 1
          fi

          echo
          echo "========================================"
          echo "Kernel version"
          echo "========================================"
          if [ -f "$ROOT/common/Makefile" ]; then
            grep -E \
              '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' \
              "$ROOT/common/Makefile" \
              || true
          fi

          echo
          echo "========================================"
          echo "OPLUS build scripts"
          echo "========================================"
          find "$ROOT/oplus/build" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort

          echo
          echo "========================================"
          echo "Build wrapper help"
          echo "========================================"
          "$ROOT/oplus/build/oplus_build_kernel.sh" \
            --help \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/oplus-build-help.txt" \
            || true

      # ============================================================
      # 8. Inspect possible sun/gki/perf build targets
      # ============================================================
      - name: "🔎 Inspect Available Build Targets"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"

          echo "========================================"
          echo "Searching build configs"
          echo "========================================"
          find . \
            -type f \
            -name 'build.config*' \
            -print \
            | sort \
            | grep -Ei \
              'sun|sm8750|gki|perf|debug' \
            | tee "$GITHUB_WORKSPACE/build-config-files.txt" \
            || true

          echo
          echo "========================================"
          echo "Searching Bazel targets"
          echo "========================================"
          if [ -x "tools/bazel" ]; then
            tools/bazel query \
              '//common:*' \
              2>/dev/null \
              | grep -Ei \
                'sun|gki|perf|debug|kernel.*dist|dist' \
              | tee "$GITHUB_WORKSPACE/bazel-targets.txt" \
              || true
          else
            echo "Bazel wrapper not found."
          fi

      # ============================================================
      # 9. Fetch Droidspaces
      # ============================================================
      - name: "📥 Fetch Droidspaces-OSS"
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf /tmp/Droidspaces-OSS

          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            /tmp/Droidspaces-OSS

          echo
          echo "Droidspaces revision:"
          git -C /tmp/Droidspaces-OSS rev-parse HEAD

          echo
          echo "Droidspaces GKI patch tree:"
          find \
            /tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI \
            -type f \
            -print \
            | sort

      # ============================================================
      # 10. Verify kernel version and locate the correct Droidspaces patch
      # ============================================================
      - name: "🩹 Locate Droidspaces GKI kABI Patch"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          ROOT="$WORKSPACE/kernel_platform"
          COMMON_DIR="$ROOT/common"

          PATCH_ROOT="/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI"
          PATCH_DIR_BELOW="$PATCH_ROOT/below-kernel-6.12"
          PATCH_DIR_612="$PATCH_ROOT/kernel-6.12"

          echo "========================================"
          echo "Kernel version detection"
          echo "========================================"

          KERNEL_VERSION="$(
            awk -F= '/^VERSION =/ {print $2} /^PATCHLEVEL =/ {print $2} /^SUBLEVEL =/ {print $2}' "$COMMON_DIR/Makefile" \
              | tr '\n' ' ' \
              | awk '{gsub(/^[[:space:]]+|[[:space:]]+$/, ""); printf "%s.%s.%s", $1, $2, $3}'
          )"

          echo "Detected kernel version: $KERNEL_VERSION"
          test -n "$KERNEL_VERSION"

          KERNEL_MAJOR="$(echo "$KERNEL_VERSION" | cut -d. -f1)"
          KERNEL_MINOR="$(echo "$KERNEL_VERSION" | cut -d. -f2)"

          echo "Kernel major: $KERNEL_MAJOR"
          echo "Kernel minor: $KERNEL_MINOR"

          if [ "$KERNEL_MAJOR" -gt 6 ] || { [ "$KERNEL_MAJOR" -eq 6 ] && [ "$KERNEL_MINOR" -ge 12 ]; }; then
            echo "Kernel family: 6.12+"
            PATCH_FILE="$(
              find "$PATCH_DIR_612" \
                -maxdepth 1 \
                -type f \
                -iname '*sysvipc*kabi*.patch' \
                -print \
                | sort \
                | head -n 1
            )"
          else
            echo "Kernel family: below 6.12"
            PATCH_FILE="$(
              find "$PATCH_DIR_BELOW" \
                -maxdepth 1 \
                -type f \
                -iname '*sysvipc*kabi*6_7_8*.patch' \
                -print \
                | sort \
                | head -n 1
            )"

            if [ -z "$PATCH_FILE" ]; then
              PATCH_FILE="$(
                find "$PATCH_DIR_BELOW" \
                  -maxdepth 1 \
                  -type f \
                  -iname '*sysvipc*kabi*.patch' \
                  -print \
                  | sort \
                  | head -n 1
              )"
            fi
          fi

          if [ -z "$PATCH_FILE" ]; then
            echo "❌ No suitable Droidspaces SYSVIPC kABI patch found."
            exit 1
          fi

          echo
          echo "Selected SYSVIPC kABI patch:"
          echo "$PATCH_FILE"
          echo "PATCH_FILE=$PATCH_FILE" >> "$GITHUB_ENV"
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"

          # POSIX_MQUEUE extra kABI patch is required ONLY for <= 5.10.
          if [ "$KERNEL_MAJOR" -lt 5 ] || { [ "$KERNEL_MAJOR" -eq 5 ] && [ "$KERNEL_MINOR" -le 10 ]; }; then
            POSIX_PATCH_FILE="$(
              find "$PATCH_DIR_BELOW" \
                -maxdepth 1 \
                -type f \
                -iname '*5.10*posix*mqueue*.patch' \
                -print \
                | sort \
                | head -n 1
            )"

            if [ -z "$POSIX_PATCH_FILE" ]; then
              echo "❌ Kernel <= 5.10 requires the Droidspaces POSIX_MQUEUE kABI patch, but it was not found."
              exit 1
            fi

            echo "POSIX_PATCH_FILE=$POSIX_PATCH_FILE" >> "$GITHUB_ENV"
            echo "POSIX_MQUEUE kABI patch: $POSIX_PATCH_FILE"
          else
            echo "POSIX_MQUEUE extra kABI patch: not required for this kernel version."
          fi

      # ============================================================
      # 11. Apply Droidspaces kABI patches
      # ============================================================
      - name: "🩹 Apply Droidspaces kABI Patches"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          COMMON_DIR="$WORKSPACE/kernel_platform/common"

          test -d "$COMMON_DIR"
          test -f "$PATCH_FILE"

          cd "$COMMON_DIR"

          echo "========================================"
          echo "Applying SYSVIPC kABI patch"
          echo "========================================"
          echo "$PATCH_FILE"
          patch --forward -p1 < "$PATCH_FILE"

          if [ -n "${POSIX_PATCH_FILE:-}" ]; then
            echo
            echo "========================================"
            echo "Applying POSIX_MQUEUE kABI patch"
            echo "========================================"
            echo "$POSIX_PATCH_FILE"
            patch --forward -p1 < "$POSIX_PATCH_FILE"
          fi

          echo
          echo "========================================"
          echo "Patch verification"
          echo "========================================"
          git diff --check || true
          git diff --stat || true

          echo "✅ Droidspaces kABI patch stage completed"

      # ============================================================
      # 12. Configure Droidspaces GKI defconfig
      #     Important: modify individual symbols, then canonicalize
      #     the defconfig using Kconfig/savedefconfig BEFORE Bazel.
      # ============================================================
      - name: "⚙️ Configure and Canonicalize Droidspaces GKI Defconfig"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          ROOT="$WORKSPACE/kernel_platform"
          COMMON_DIR="$ROOT/common"
          CONFIG_FILE="$COMMON_DIR/arch/arm64/configs/gki_defconfig"
          CONFIG_OUT="$ROOT/out/droidspaces-defconfig"

          echo "WORKSPACE   : $WORKSPACE"
          echo "COMMON_DIR  : $COMMON_DIR"
          echo "CONFIG_FILE : $CONFIG_FILE"
          echo "CONFIG_OUT  : $CONFIG_OUT"

          if [ ! -d "$COMMON_DIR" ]; then
            echo "❌ COMMON_DIR does not exist: $COMMON_DIR"
            exit 1
          fi

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ gki_defconfig not found: $CONFIG_FILE"
            exit 1
          fi

          cd "$COMMON_DIR"

          # ----------------------------------------------------------------
          # Droidspaces GKI configuration.
          # These are exactly the GKI options from the Droidspaces guide.
          # Do not add unrelated GKI options.
          # ----------------------------------------------------------------
          REQUIRED_CONFIGS=(
            "CONFIG_SYSVIPC=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_PID_NS=y"
            "CONFIG_DEVTMPFS=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          )

          OPTIONAL_CONFIGS=(
            "CONFIG_USER_NS=y"
            "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            "CONFIG_IP_SET=y"
            "CONFIG_IP_SET_HASH_IP=y"
            "CONFIG_IP_SET_HASH_NET=y"
            "CONFIG_NETFILTER_XT_SET=y"
            "CONFIG_TMPFS_POSIX_ACL=y"
            "CONFIG_TMPFS_XATTR=y"
          )

          set_config() {
            local cfg="$1"
            local key="${cfg%%=*}"

            if grep -qE "^${key}=.*$" "$CONFIG_FILE"; then
              sed -i "s|^${key}=.*$|${cfg}|" "$CONFIG_FILE"
            elif grep -qE "^# ${key} is not set$" "$CONFIG_FILE"; then
              sed -i "s|^# ${key} is not set$|${cfg}|" "$CONFIG_FILE"
            else
              # Droidspaces explicitly allows a missing individual option
              # to be added at the end. We canonicalize with savedefconfig
              # immediately afterwards, which resolves Kconfig ordering.
              echo "$cfg" >> "$CONFIG_FILE"
            fi
          }

          echo
          echo "========================================"
          echo "Required Droidspaces GKI configs"
          echo "========================================"
          for cfg in "${REQUIRED_CONFIGS[@]}"; do
            echo "Enabling: $cfg"
            set_config "$cfg"
          done

          if [ "${{ inputs.APPLY_OPTIONAL_CONFIG }}" = "true" ]; then
            echo
            echo "========================================"
            echo "Optional/recommended Droidspaces GKI configs"
            echo "========================================"
            for cfg in "${OPTIONAL_CONFIGS[@]}"; do
              echo "Enabling: $cfg"
              set_config "$cfg"
            done
          else
            echo
            echo "Optional/recommended Droidspaces GKI configs: DISABLED"
          fi

          echo
          echo "========================================"
          echo "Pre-canonicalization config"
          echo "========================================"
          grep -E \
            '^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|NETFILTER_XT_MATCH_ADDRTYPE|USER_NS|NETFILTER_XT_TARGET_REJECT|NETFILTER_XT_TARGET_LOG|NETFILTER_XT_MATCH_RECENT|IP_SET|IP_SET_HASH_IP|IP_SET_HASH_NET|NETFILTER_XT_SET|TMPFS_POSIX_ACL|TMPFS_XATTR)=' \
            "$CONFIG_FILE" \
            || true

          # ----------------------------------------------------------------
          # IMPORTANT FIX FOR THIS ONEPLUS/KLEAF TREE:
          #
          # OnePlus's GKI build checks:
          #   make savedefconfig
          #   diff generated_defconfig gki_defconfig
          #
          # Therefore the Droidspaces-edited source file must first be
          # canonicalized by the same Kconfig machinery. This also explains
          # the previous failure where PID_NS/IPC_NS disappeared and other
          # symbols moved positions in the generated defconfig.
          # ----------------------------------------------------------------
          rm -rf "$CONFIG_OUT"
          mkdir -p "$CONFIG_OUT"

          echo
          echo "========================================"
          echo "Generate Kconfig .config from gki_defconfig"
          echo "========================================"
          make \
            -C "$COMMON_DIR" \
            O="$CONFIG_OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          echo
          echo "========================================"
          echo "Generate canonical savedefconfig"
          echo "========================================"
          make \
            -C "$COMMON_DIR" \
            O="$CONFIG_OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            savedefconfig

          test -s "$CONFIG_OUT/defconfig"

          echo
          echo "========================================"
          echo "Replace source gki_defconfig with canonical version"
          echo "========================================"
          cp -f "$CONFIG_OUT/defconfig" "$CONFIG_FILE"

          echo
          echo "========================================"
          echo "Canonical gki_defconfig"
          echo "========================================"
          grep -E \
            '^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|NETFILTER_XT_MATCH_ADDRTYPE|USER_NS|NETFILTER_XT_TARGET_REJECT|NETFILTER_XT_TARGET_LOG|NETFILTER_XT_MATCH_RECENT|IP_SET|IP_SET_HASH_IP|IP_SET_HASH_NET|NETFILTER_XT_SET|TMPFS_POSIX_ACL|TMPFS_XATTR)=' \
            "$CONFIG_FILE" \
            || true

          echo
          echo "========================================"
          echo "Verify final .config values"
          echo "========================================"
          for key in \
            CONFIG_SYSVIPC \
            CONFIG_POSIX_MQUEUE \
            CONFIG_IPC_NS \
            CONFIG_PID_NS \
            CONFIG_DEVTMPFS \
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE; do
            value="$(scripts/config --file "$CONFIG_OUT/.config" --get "$key" 2>/dev/null || true)"
            echo "$key=$value"
            if [ "$value" != "y" ]; then
              echo "❌ Required Droidspaces config is not enabled in final .config: $key"
              exit 1
            fi
          done

          if [ "${{ inputs.APPLY_OPTIONAL_CONFIG }}" = "true" ]; then
            for key in \
              CONFIG_USER_NS \
              CONFIG_NETFILTER_XT_TARGET_REJECT \
              CONFIG_NETFILTER_XT_TARGET_LOG \
              CONFIG_NETFILTER_XT_MATCH_RECENT \
              CONFIG_IP_SET \
              CONFIG_IP_SET_HASH_IP \
              CONFIG_IP_SET_HASH_NET \
              CONFIG_NETFILTER_XT_SET \
              CONFIG_TMPFS_POSIX_ACL \
              CONFIG_TMPFS_XATTR; do
              value="$(scripts/config --file "$CONFIG_OUT/.config" --get "$key" 2>/dev/null || true)"
              echo "$key=$value"
              if [ "$value" != "y" ]; then
                echo "❌ Optional/recommended config requested but not enabled: $key"
                exit 1
              fi
            done
          fi

          echo
          echo "========================================"
          echo "Canonical defconfig self-check"
          echo "========================================"
          rm -rf "$CONFIG_OUT/recheck"
          mkdir -p "$CONFIG_OUT/recheck"

          make \
            -C "$COMMON_DIR" \
            O="$CONFIG_OUT/recheck" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

          make \
            -C "$COMMON_DIR" \
            O="$CONFIG_OUT/recheck" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            savedefconfig

          diff -u "$CONFIG_FILE" "$CONFIG_OUT/recheck/defconfig"
          echo "✅ gki_defconfig is canonical and matches savedefconfig"

          echo
          echo "========================================"
          echo "Defconfig git diff"
          echo "========================================"
          git diff -- arch/arm64/configs/gki_defconfig || true

          # Preserve the config workspace for diagnostics/artifacts.
          cp -f "$CONFIG_FILE" "$GITHUB_WORKSPACE/final-gki_defconfig"
          cp -f "$CONFIG_OUT/.config" "$GITHUB_WORKSPACE/final-dot-config"

      # ============================================================
      # 13. Verify KMI settings
      # ============================================================
      - name: "🔐 Verify GKI KMI Settings"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"

          echo "========================================"
          echo "KMI related configuration"
          echo "========================================"
          grep -R \
            -n \
            -E \
            'KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI|kmi_symbol_list_strict_mode' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -200 \
            || true

          echo
          echo "KMI strict checks have NOT been disabled."

      # ============================================================
      # 14. Record source revisions
      # ============================================================
      - name: "📝 Record Source Revisions"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          ROOT="$WORKSPACE/kernel_platform"

          {
            echo "========================================"
            echo "OnePlus Pad 2 Pro Droidspaces Build"
            echo "========================================"
            echo
            echo "Kernel version:"
            echo "$KERNEL_VERSION"
            echo
            echo "Manifest branch:"
            echo "$MANIFEST_BRANCH"
            echo
            echo "Manifest file:"
            echo "$MANIFEST_FILE"
            echo
            echo "Target:"
            echo "$TARGET"
            echo
            echo "Variant:"
            echo "$VARIANT"
            echo
            echo "Optional/recommended configs:"
            echo "${{ inputs.APPLY_OPTIONAL_CONFIG }}"
            echo
            echo "Clean build:"
            echo "${{ inputs.CLEAN_BUILD }}"
            echo
            echo "SYSVIPC kABI patch:"
            echo "$PATCH_FILE"
            if [ -n "${POSIX_PATCH_FILE:-}" ]; then
              echo
              echo "POSIX_MQUEUE kABI patch:"
              echo "$POSIX_PATCH_FILE"
            fi
            echo
            echo "========================================"
            echo "Droidspaces revision"
            echo "========================================"
            git -C /tmp/Droidspaces-OSS rev-parse HEAD \
              2>/dev/null || true
            echo
            echo "========================================"
            echo "Repo revisions"
            echo "========================================"
            cd "$WORKSPACE"
            repo forall -c \
              'printf "%s " "$REPO_PATH"; git rev-parse HEAD' \
              2>/dev/null \
              | sort \
              || true
          } > "$GITHUB_WORKSPACE/SOURCE_INFO.txt"

          cat "$GITHUB_WORKSPACE/SOURCE_INFO.txt"

      # ============================================================
      # 15. Clean build output
      # ============================================================
      - name: "🧹 Prepare Kernel Build Output"
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"

          if [ "${{ inputs.CLEAN_BUILD }}" = "true" ]; then
            echo "Clean build enabled."
            rm -rf \
              out/.cache \
              out/bazel \
              out/msm-kernel-* \
              out/common \
              out/dist \
              out/droidspaces-defconfig \
              2>/dev/null || true
          else
            echo "Clean build disabled."
          fi

      # ============================================================
      # 16. Build kernel using OnePlus official wrapper
      # ============================================================
      - name: "🔨 Build OnePlus SM8750 Kernel"
        shell: bash
        run: |
          set -o pipefail

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"

          LOG="$GITHUB_WORKSPACE/build-${TARGET}-${VARIANT}.log"

          echo "========================================"
          echo "OnePlus Kernel Build"
          echo "========================================"
          echo "Kernel  : $KERNEL_VERSION"
          echo "TARGET  : $TARGET"
          echo "VARIANT : $VARIANT"
          echo "JOBS    : $BUILD_JOBS"
          echo
          echo "Build wrapper:"
          echo "$ROOT/oplus/build/oplus_build_kernel.sh"
          echo
          echo "Build command:"
          echo "./oplus/build/oplus_build_kernel.sh \"$TARGET\" \"$VARIANT\""
          echo
          echo "========================================"
          echo "BUILD START"
          echo "========================================"

          ./oplus/build/oplus_build_kernel.sh \
            "$TARGET" \
            "$VARIANT" \
            2>&1 \
            | tee "$LOG"

          BUILD_EXIT=${PIPESTATUS[0]}

          echo
          echo "========================================"
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "========================================"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo
            echo "❌ OnePlus kernel build failed."
            echo
            echo "Last 200 lines:"
            tail -n 200 "$LOG" || true
            exit "$BUILD_EXIT"
          fi

          echo
          echo "✅ Kernel build completed successfully."

      # ============================================================
      # 17. Search build outputs
      # ============================================================
      - name: "📦 Locate Kernel Artifacts"
        if: always()
        shell: bash
        run: |
          set -u

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          ROOT="$WORKSPACE/kernel_platform"
          DEST="$GITHUB_WORKSPACE/Final-GKI-Image"

          mkdir -p "$DEST"

          echo "========================================"
          echo "Kernel output search"
          echo "========================================"

          if [ ! -d "$ROOT/out" ]; then
            echo "⚠️ No out directory found:"
            echo "$ROOT/out"
          else
            echo
            echo "=== dist directories ==="
            find "$ROOT/out" \
              -type d \
              -name dist \
              -print \
              | sort \
              || true

            echo
            echo "=== Kernel images ==="
            find "$ROOT/out" \
              -type f \
              \( \
                -name Image \
                -o -name Image.lz4 \
                -o -name Image.gz \
                -o -name Image.gz-dtb \
                -o -name boot.img \
                -o -name vendor_boot.img \
                -o -name vendor_kernel_boot.img \
                -o -name vendor_dlkm.img \
                -o -name system_dlkm.img \
                -o -name system_dlkm.flatten.erofs.img \
                -o -name dtbo.img \
                -o -name vmlinux \
                -o -name System.map \
                -o -name .config \
              \) \
              -print \
              | sort \
              | tee "$GITHUB_WORKSPACE/found-artifacts.txt" \
              || true
          fi

          echo
          echo "========================================"
          echo "Collect dist directories"
          echo "========================================"
          if [ -d "$ROOT/out" ]; then
            while IFS= read -r DIST; do
              [ -d "$DIST" ] || continue
              echo
              echo "Collecting:"
              echo "$DIST"
              cp -a \
                "$DIST"/. \
                "$DEST/" \
                2>/dev/null || true
            done < <(
              find "$ROOT/out" \
                -type d \
                -name dist \
                -print \
                2>/dev/null
            )
          fi

          echo
          echo "========================================"
          echo "Collect individual kernel artifacts"
          echo "========================================"
          if [ -d "$ROOT/out" ]; then
            while IFS= read -r FILE; do
              [ -f "$FILE" ] || continue
              REL="${FILE#$ROOT/out/}"
              SAFE_NAME="$(echo "$REL" | tr '/' '_')"
              cp -f \
                "$FILE" \
                "$DEST/$SAFE_NAME" \
                2>/dev/null || true
            done < <(
              find "$ROOT/out" \
                -type f \
                \( \
                  -name Image \
                  -o -name Image.lz4 \
                  -o -name Image.gz \
                  -o -name Image.gz-dtb \
                  -o -name boot.img \
                  -o -name vendor_boot.img \
                  -o -name vendor_kernel_boot.img \
                  -o -name vendor_dlkm.img \
                  -o -name system_dlkm.img \
                  -o -name system_dlkm.flatten.erofs.img \
                  -o -name dtbo.img \
                  -o -name vmlinux \
                  -o -name System.map \
                  -o -name .config \
                \) \
                -print
            )
          fi

          # Also preserve the canonical defconfig and config diagnostics.
          [ -f "$GITHUB_WORKSPACE/final-gki_defconfig" ] && cp -f "$GITHUB_WORKSPACE/final-gki_defconfig" "$DEST/" || true
          [ -f "$GITHUB_WORKSPACE/final-dot-config" ] && cp -f "$GITHUB_WORKSPACE/final-dot-config" "$DEST/" || true

          echo
          echo "========================================"
          echo "Final artifact list"
          echo "========================================"
          find "$DEST" \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            || true

      # ============================================================
      # 18. Validate artifacts
      # ============================================================
      - name: "🧪 Validate Kernel Artifacts"
        if: always()
        shell: bash
        run: |
          set -u

          DEST="$GITHUB_WORKSPACE/Final-GKI-Image"

          echo "========================================"
          echo "Artifact validation"
          echo "========================================"

          if [ ! -d "$DEST" ]; then
            echo "❌ Artifact directory does not exist."
            exit 1
          fi

          find "$DEST" \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          IMAGE_FOUND=0
          for FILE in \
            "$DEST/Image" \
            "$DEST/Image.lz4" \
            "$DEST/Image.gz" \
            "$DEST/Image.gz-dtb" \
            "$DEST/boot.img"
          do
            if [ -s "$FILE" ]; then
              echo
              echo "✅ Valid kernel artifact:"
              echo "$FILE"
              IMAGE_FOUND=1
            fi
          done

          if [ "$IMAGE_FOUND" -eq 0 ]; then
            echo
            echo "⚠️ No Image/boot.img found."
            echo
            echo "This may mean:"
            echo "1. The build failed."
            echo "2. The selected variant uses a different output format."
            echo "3. The OnePlus build system stores the result elsewhere."
            # Do not fail here.
            # Logs will still be uploaded.
          else
            echo
            echo "✅ Kernel artifact validation passed."
          fi

      # ============================================================
      # 19. Generate final build information
      # ============================================================
      - name: "📝 Generate Build Information"
        if: always()
        shell: bash
        run: |
          set -u

          WORKSPACE="$(realpath -m "$WORKSPACE")"
          DEST="$GITHUB_WORKSPACE/Final-GKI-Image"
          mkdir -p "$DEST"

          {
            echo "========================================"
            echo "OnePlus Pad 2 Pro Droidspaces Kernel"
            echo "========================================"
            echo
            echo "Kernel version  : ${KERNEL_VERSION:-unknown}"
            echo "Manifest branch : $MANIFEST_BRANCH"
            echo "Manifest file   : $MANIFEST_FILE"
            echo "Target          : $TARGET"
            echo "Variant         : $VARIANT"
            echo "Optional config : ${{ inputs.APPLY_OPTIONAL_CONFIG }}"
            echo "Clean build     : ${{ inputs.CLEAN_BUILD }}"
            echo
            echo "========================================"
            echo "Droidspaces revision"
            echo "========================================"
            git -C /tmp/Droidspaces-OSS rev-parse HEAD \
              2>/dev/null || true
            echo
            echo "========================================"
            echo "Selected kABI patch"
            echo "========================================"
            echo "SYSVIPC: ${PATCH_FILE:-unknown}"
            echo "POSIX_MQUEUE: ${POSIX_PATCH_FILE:-not required}"
            echo
            echo "========================================"
            echo "Kernel platform revision"
            echo "========================================"
            git -C "$WORKSPACE/kernel_platform" rev-parse HEAD \
              2>/dev/null || true
            echo
            echo "========================================"
            echo "Build host"
            echo "========================================"
            uname -a
            echo
            echo "CPU:"
            nproc
            echo
            echo "Memory:"
            free -h
            echo
            echo "Disk:"
            df -h "$GITHUB_WORKSPACE"
          } > "$DEST/BUILD_INFO.txt"

          echo
          echo "BUILD_INFO.txt:"
          cat "$DEST/BUILD_INFO.txt"

      # ============================================================
      # 20. Upload kernel artifacts
      # ============================================================
      - name: "📤 Upload Kernel Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >
            oneplus_pad_2_pro_sm8750_droidspaces_
            ${{ env.TARGET }}_
            ${{ env.VARIANT }}
          path: |
            Final-GKI-Image/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      # ============================================================
      # 21. Upload build logs
      # ============================================================
      - name: "📤 Upload Build Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >
            oneplus_pad_2_pro_sm8750_build_logs_
            ${{ env.TARGET }}_
            ${{ env.VARIANT }}
          path: |
            build-${{ env.TARGET }}-${{ env.VARIANT }}.log
            oplus-build-help.txt
            bazel-targets.txt
            build-config-files.txt
            found-artifacts.txt
            SOURCE_INFO.txt
            final-gki_defconfig
            final-dot-config
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 22. ccache statistics
      # ============================================================
      - name: "📊 ccache Statistics"
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true
