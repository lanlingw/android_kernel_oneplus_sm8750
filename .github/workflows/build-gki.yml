name: Build OnePlus Pad 2 Pro Pure GKI Kernel (Droidspaces)

on:
  workflow_dispatch:
    inputs:
      TARGET:
        description: "Kleaf GKI Target (SM8750 通常为 sun)"
        required: false
        type: string
        default: "sun"
      VARIANT:
        description: "Build Variant (gki / perf / debug)"
        required: false
        type: string
        default: "gki"

jobs:
  build:
    name: Build Pure GKI ${{ inputs.TARGET || 'sun' }}-${{ inputs.VARIANT || 'gki' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    env:
      TARGET: ${{ inputs.TARGET || 'sun' }}
      VARIANT: ${{ inputs.VARIANT || 'gki' }}
      WORKSPACE: kernel_workspace

    steps:
      - name: "🚀 Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "📦 Install Build Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python-is-python3 git curl wget ccache \
            build-essential flex bison libssl-dev libncurses-dev zlib1g-dev \
            rsync unzip gawk dos2unix bc \
            libelf-dev pkg-config gcc-aarch64-linux-gnu clang lld llvm \
            openjdk-17-jdk android-sdk-libsparse-utils \
            libncurses-dev lib32z1-dev libxml2-utils lzop pngcrush \
            schedtool squashfs-tools xsltproc yasm cpio repo

      - name: "📥 Init & Sync Official OnePlus Manifest"
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          
          # 初始化 SM8750 平板源码树
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8750 \
            -m oneplus_pad_2_pro_b.xml \
            --depth=1

          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --force-sync

      - name: "🩹 Apply Droidspaces kABI Patch (Below 6.12)"
        run: |
          set -euo pipefail
          echo "⬇️ Fetching Droidspaces-OSS kABI patches..."
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS
          
          PATCH_FILE="/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kABI_6_7_8.patch"
          COMMON_DIR="$WORKSPACE/kernel_platform/common"
          
          if [ -f "$PATCH_FILE" ]; then
            echo "✅ Applying kABI fix for Linux 6.6..."
            cd "$COMMON_DIR"
            patch -p1 < "$PATCH_FILE"
          else
            echo "❌ Required kABI patch not found!"
            exit 1
          fi

      - name: "⚙️ Configure gki_defconfig for Droidspaces"
        run: |
          set -euo pipefail
          cd "$WORKSPACE/kernel_platform/common"
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          
          CONFIGS=(
            "CONFIG_SYSVIPC=y" "CONFIG_SYSVIPC_SYSCTL=y" "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_IPC_NS=y" "CONFIG_PID_NS=y" "CONFIG_NET_NS=y" "CONFIG_UTS_NS=y" "CONFIG_USER_NS=y"
            "CONFIG_CGROUPS=y" "CONFIG_CGROUP_DEVICE=y" "CONFIG_CGROUP_FREEZER=y"
            "CONFIG_CGROUP_SCHED=y" "CONFIG_CPUSETS=y" "CONFIG_MEMCG=y"
            "CONFIG_VETH=y" "CONFIG_MACVLAN=y" "CONFIG_BRIDGE=y"
            "CONFIG_NETFILTER_XT_MATCH_COMMENT=y" "CONFIG_IP_NF_TARGET_MASQUERADE=y"
            "CONFIG_BINFMT_MISC=y" "CONFIG_OVERLAY_FS=y" "CONFIG_FUSE_FS=y"
          )
          
          echo "📝 Updating $CONFIG_FILE for GKI compliance..."
          for cfg in "${CONFIGS[@]}"; do
            key="${cfg%=*}"
            if grep -q "^# ${key} is not set" "$CONFIG_FILE"; then
              sed -i "s|^# ${key} is not set|${cfg}|g" "$CONFIG_FILE"
            elif ! grep -q "^${cfg}" "$CONFIG_FILE"; then
              echo "${cfg}" >> "$CONFIG_FILE"
            fi
          done

      - name: "🩹 Relax KMI/kABI Strict Checks"
        run: |
          set -euo pipefail
          cd "$WORKSPACE/kernel_platform"
          
          # 放宽 GKI 符号列表校验，允许自定义配置通过
          find . -name "build.config.gki*" -exec sed -i 's/KMI_SYMBOL_LIST_STRICT_MODE=1/KMI_SYMBOL_LIST_STRICT_MODE=0/g' {} + || true
          find . -name "build.config.gki*" -exec sed -i 's/TRIM_NONLISTED_KMI=1/TRIM_NONLISTED_KMI=0/g' {} + || true
          
          python3 - << 'PYEOF'
          import os
          path = "common/BUILD.bazel"
          if os.path.exists(path):
              with open(path, "r") as f: c = f.read()
              c = c.replace("kmi_symbol_list_strict_mode = True", "kmi_symbol_list_strict_mode = False")
              with open(path, "w") as f: f.write(c)
              print("✅ Relaxed BUILD.bazel kABI strict mode")
          PYEOF

      - name: "🔨 Build Pure GKI Kernel via Bazel"
        run: |
          set -euo pipefail
          cd "$WORKSPACE/kernel_platform"
          
          # 纯 GKI 构建命令，不加载 vendor 模块
          # 注意：如果 sun 没有独立的 _gki variant，可尝试 //common:sun_gki 或查看 common/BUILD.bazel
          BUILD_TARGET="//common:${TARGET}_${VARIANT}"
          
          echo "🏗️ Building pure GKI target: $BUILD_TARGET"
          tools/bazel build "$BUILD_TARGET" \
            --keep_going \
            --verbose_failures \
            2>&1 | tee "$GITHUB_WORKSPACE/build-gki-${TARGET}-${VARIANT}.log"

      - name: "📦 Collect Pure GKI Artifacts"
        if: always()
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/Final-GKI-Image"
          mkdir -p "$DEST"
          
          # GKI 产物通常在 out/msm-kernel-<target>_<variant>/dist 或 out/common/dist
          DIST_CANDIDATES=(
            "$WORKSPACE/kernel_platform/out/msm-kernel-${TARGET}_${VARIANT}/dist"
            "$WORKSPACE/kernel_platform/out/${TARGET}_${VARIANT}/dist"
            "$WORKSPACE/kernel_platform/out/common/dist"
          )
          
          DIST=""
          for d in "${DIST_CANDIDATES[@]}"; do
            if [ -d "$d" ] && [ -f "$d/Image" ]; then
              DIST="$d"
              break
            fi
          done
          
          if [ -z "$DIST" ]; then
            echo "⚠️ No valid GKI dist directory found. Listing out/ structure:"
            find "$WORKSPACE/kernel_platform/out" -maxdepth 3 -type d || true
            exit 0
          fi
          
          echo "📂 Found GKI dist at: $DIST"
          cp "$DIST"/Image "$DEST/" 2>/dev/null || true
          cp "$DIST"/Image.lz4 "$DEST/" 2>/dev/null || true
          cp "$DIST"/boot.img "$DEST/" 2>/dev/null || true
          cp "$DIST"/system_dlkm*.img "$DEST/" 2>/dev/null || true
          cp "$DIST"/vmlinux "$DEST/" 2>/dev/null || true
          cp "$DIST"/System.map "$DEST/" 2>/dev/null || true
          cp "$DIST"/.config "$DEST/" 2>/dev/null || true
          
          echo "Artifact layout:"
          ls -lhR "$DEST" || true

      - name: "📤 Upload GKI Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pure_gki_pad2pro_${{ env.TARGET }}_${{ env.VARIANT }}
          path: Final-GKI-Image
          retention-days: 7

      - name: "📤 Upload Build Log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gki_build_log_${{ env.TARGET }}_${{ env.VARIANT }}
          path: build-gki-${{ env.TARGET }}-${{ env.VARIANT }}.log
          retention-days: 3
