name: Build OnePlus Pad 2 Pro Kernel (Official Kleaf)

on:
  workflow_dispatch:
    inputs:
      TARGET:
        description: "Kleaf target（官方 README：sun）"
        required: false
        type: string
        default: "sun"
      VARIANT:
        description: "Kleaf variant（官方 README：perf）"
        required: false
        type: string
        default: "perf"
      CUSTOM_CONFIG:
        description: "可选：追加到 arch/arm64/configs/vendor/sun_perf.config 的自定义配置（逗号分隔，如 CONFIG_SYSVIPC=y）"
        required: false
        type: string
        default: "CONFIG_SYSVIPC=y,CONFIG_POSIX_MQUEUE=y,CONFIG_IPC_NS=y,CONFIG_PID_NS=y"

jobs:
  build:
    name: Build ${{ inputs.TARGET }} ${{ inputs.VARIANT }}
    runs-on: ubuntu-latest
    timeout-minutes: 480

    env:
      TARGET: ${{ inputs.TARGET }}
      VARIANT: ${{ inputs.VARIANT }}
      CUSTOM_CONFIG: ${{ inputs.CUSTOM_CONFIG }}
      WORKSPACE: kernel_workspace
      ACK_DIR: kernel_workspace/kernel_platform

    steps:
      - name: "Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "Install Build Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip git curl \
            rsync unzip zip bc bison flex \
            libssl-dev libelf-dev libncurses-dev zlib1g-dev \
            pkg-config openjdk-17-jdk

      - name: "Install Bazelisk (reads kernel_platform/.bazelversion)"
        run: |
          version=$(curl -fsSL https://api.github.com/repos/bazelbuild/bazelisk/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
          curl -fsSL "https://github.com/bazelbuild/bazelisk/releases/download/v${version}/bazelisk-linux-amd64" -o bazelisk
          chmod +x bazelisk
          sudo mv bazelisk /usr/local/bin/bazel
          bazel --version || true

      - name: "Install Repo Tool"
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          repo --version

      - name: "Init & Sync Official OnePlus Manifest"
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8750 \
            -m oneplus_pad_2_pro_b.xml \
            --depth=1

          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --force-sync

          echo "workspace root:"
          ls -la
          echo "kernel_platform:"
          ls -la kernel_platform/
          echo "oplus build scripts:"
          ls -la kernel_platform/oplus/build/ | head

      - name: "Apply optional custom config fragment"
        run: |
          set -euo pipefail
          if [ -n "$CUSTOM_CONFIG" ]; then
            CONFIG_FILE="$ACK_DIR/msm-kernel/arch/arm64/configs/vendor/${TARGET}_${VARIANT}.config"
            if [ -f "$CONFIG_FILE" ]; then
              IFS=',' read -ra CFGS <<< "$CUSTOM_CONFIG"
              for cfg in "${CFGS[@]}"; do
                cfg="$(echo "$cfg" | tr -d '[:space:]')"
                [ -z "$cfg" ] && continue
                key="${cfg%%=*}"
                grep -q "^${key}=" "$CONFIG_FILE" && sed -i "s|^${key}=.*|${cfg}|" "$CONFIG_FILE" \
                  || echo "$cfg" >> "$CONFIG_FILE"
                echo "applied: $cfg"
              done
            else
              echo "custom config skipped: $CONFIG_FILE not found"
            fi
          fi

      - name: "Build kernel via official Kleaf (build_with_bazel.py -t TARGET VARIANT)"
        run: |
          set -euo pipefail
          cd "$ACK_DIR"

          # JAVA_HOME: oplus scripts expect jdk21 at TOPDIR/prebuilts/jdk/jdk21, but the
          # manifest only ships jdk11; bazel ships its own JDK so build does not depend on it.
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="/usr/local/bin:$PATH"

          # official core build command (same as oplus_build_kernel.sh/prepare_vendor.sh invokes)
          python3 build_with_bazel.py \
            -t "$TARGET" "$VARIANT" \
            --out_dir "$PWD/out/msm-kernel-${TARGET}-${VARIANT}" \
            2>&1 | tee "$GITHUB_WORKSPACE/build-kernel-${TARGET}-${VARIANT}.log"

          echo
          echo "=== dist output ==="
          ls -la "$PWD/out/msm-kernel-${TARGET}-${VARIANT}/dist/" || true

      - name: "Collect dist artifacts"
        if: always()
        run: |
          set -euo pipefail
          DIST="$ACK_DIR/out/msm-kernel-${TARGET}-${VARIANT}/dist"
          DEST="$GITHUB_WORKSPACE/Final-Image"
          mkdir -p "$DEST/modules" "$DEST/dtb"

          if [ ! -d "$DIST" ]; then
            echo "dist directory missing, nothing to collect"
            exit 0
          fi

          for f in boot.img init_boot.img vendor_boot.img Image Image.gz Image.lz4 \
                   vmlinux System.map .config; do
            if [ -f "$DIST/$f" ]; then
              cp "$DIST/$f" "$DEST/$(basename "$f")"
            fi
          done

          cp "$DIST"/*.dtb "$DEST/dtb/" 2>/dev/null || true
          cp "$DIST"/*.dtbo "$DEST/dtb/" 2>/dev/null || true
          cp "$DIST"/*.ko "$DEST/modules/" 2>/dev/null || true
          cp "$DIST"/modules.load "$DEST/" 2>/dev/null || true
          cp "$DIST"/vendor_dlkm.modules.load "$DEST/" 2>/dev/null || true

          echo "Artifact layout:"
          find "$DEST" -maxdepth 2 -type f | sort | sed 's#^# - #' || true

      - name: "Upload Kernel Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel_pad2pro_${{ inputs.TARGET }}_${{ inputs.VARIANT }}
          path: |
            Final-Image
          retention-days: 7

      - name: "Upload Build Log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log_pad2pro_${{ inputs.TARGET }}_${{ inputs.VARIANT }}
          path: |
            build-kernel-${{ inputs.TARGET }}-${{ inputs.VARIANT }}.log
          retention-days: 3
