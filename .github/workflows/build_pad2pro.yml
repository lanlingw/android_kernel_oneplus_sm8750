name: Build SM8750 Pure GKI Kernel
on:
  workflow_dispatch:
    inputs:
      APPLY_OPTIONAL_CONFIG:
        description: "Enable optional Droidspaces GKI configs"
        required: false
        type: boolean
        default: false
      CLEAN_BUILD:
        description: "Clean Bazel/output before build"
        required: false
        type: boolean
        default: true
jobs:
  build:
    name: OnePlus Pad 2 Pro SM8750 Pure GKI
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      MANIFEST_BRANCH: oneplus/sm8750
      MANIFEST_FILE: oneplus_pad_2_pro_b.xml
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
    steps:
      - name: "🚀 Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: "📦 Install Build Dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python-is-python3 \
            git \
            curl \
            wget \
            ccache \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            zlib1g-dev \
            rsync \
            unzip \
            gawk \
            dos2unix \
            bc \
            libelf-dev \
            pkg-config \
            gcc-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            openjdk-17-jdk \
            android-sdk-libsparse-utils \
            lib32z1-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            xsltproc \
            yasm \
            cpio \
            repo
          python3 --version
          git --version
          repo --version || true
          clang --version
          ld.lld --version

      - name: "⚡ Configure ccache"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --show-config

      - name: "📦 Restore ccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sm8750-pad2pro-${{ github.run_id }}
          restore-keys: |
            ccache-sm8750-pad2pro-

      - name: "📥 Init Official OnePlus SM8750 Manifest"
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b "$MANIFEST_BRANCH" \
            -m "$MANIFEST_FILE" \
            --depth=1

      - name: "📥 Sync OnePlus Kernel Source"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$WORKSPACE"
          repo sync \
            -c \
            -j"$(nproc --all)" \
            --no-tags \
            --no-clone-bundle \
            --force-sync
          test -d "$WORKSPACE/kernel_platform"
          ls -lah "$WORKSPACE/kernel_platform"

      - name: "🔎 Verify GKI Source Tree"
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          COMMON="$ROOT/common"
          test -d "$ROOT"
          test -d "$COMMON"
          test -f "$COMMON/BUILD.bazel"
          test -f "$COMMON/arch/arm64/configs/gki_defconfig"
          echo "ROOT   = $ROOT"
          echo "COMMON = $COMMON"
          echo
          echo "=== Kernel version ==="
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' \
            "$COMMON/Makefile" \
            || true
          echo
          echo "=== GKI files ==="
          find "$COMMON" \
            -maxdepth 2 \
            -type f \
            \( \
              -name 'build.config*' \
              -o -name 'BUILD.bazel' \
            \) \
            -print \
            | sort

      - name: "📥 Fetch Droidspaces-OSS"
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/Droidspaces-OSS
          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            /tmp/Droidspaces-OSS
          echo "Droidspaces revision:"
          git -C /tmp/Droidspaces-OSS rev-parse HEAD

      - name: "🩹 Locate Droidspaces SYSVIPC Patch"
        shell: bash
        run: |
          set -euxo pipefail
          PATCH_DIR="/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          test -d "$PATCH_DIR"
          echo "Available patches:"
          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort
          PATCH_FILE="$(
            find "$PATCH_DIR" \
              -maxdepth 1 \
              -type f \
              -iname '*sysvipc*kabi*6_7_8*.patch' \
              | head -n 1
          )"
          if [ -z "$PATCH_FILE" ]; then
            echo "ERROR: SYSVIPC kABI patch not found."
            exit 1
          fi
          echo "PATCH_FILE=$PATCH_FILE" >> "$GITHUB_ENV"
          echo
          echo "Selected patch:"
          echo "$PATCH_FILE"

      - name: "🩹 Apply Droidspaces SYSVIPC kABI Patch"
        shell: bash
        run: |
          set -euxo pipefail
          COMMON="$WORKSPACE/kernel_platform/common"
          cd "$COMMON"
          echo "Applying patch:"
          echo "$PATCH_FILE"
          patch \
            --forward \
            -p1 \
            < "$PATCH_FILE"
          echo
          echo "=== Patch result ==="
          git diff --stat || true
          git diff --check || true

      - name: "⚙️ Configure Droidspaces GKI Defconfig"
        shell: bash
        run: |
          set -euxo pipefail
          COMMON="$WORKSPACE/kernel_platform/common"
          CONFIG="$COMMON/arch/arm64/configs/gki_defconfig"
          echo "COMMON = $COMMON"
          echo "CONFIG = $CONFIG"
          test -f "$CONFIG"
          REQUIRED_CONFIGS=(
            "CONFIG_SYSVIPC=y"
            "CONFIG_SYSVIPC_SYSCTL=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_PID_NS=y"
            "CONFIG_NET_NS=y"
            "CONFIG_UTS_NS=y"
            "CONFIG_USER_NS=y"
            "CONFIG_CGROUPS=y"
            "CONFIG_CGROUP_DEVICE=y"
            "CONFIG_CGROUP_FREEZER=y"
            "CONFIG_CGROUP_SCHED=y"
            "CONFIG_CPUSETS=y"
            "CONFIG_MEMCG=y"
            "CONFIG_VETH=y"
            "CONFIG_MACVLAN=y"
            "CONFIG_BRIDGE=y"
            "CONFIG_BINFMT_MISC=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_FUSE_FS=y"
            "CONFIG_DEVTMPFS=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          )
          OPTIONAL_CONFIGS=(
            "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            "CONFIG_IP_SET=y"
            "CONFIG_IP_SET_HASH_IP=y"
            "CONFIG_IP_SET_HASH_NET=y"
            "CONFIG_NETFILTER_XT_SET=y"
            "CONFIG_TMPFS_POSIX_ACL=y"
            "CONFIG_TMPFS_XATTR=y"
          )
          set_config() {
            local cfg="$1"
            local key="${cfg%%=*}"
            if grep -qE "^${key}=.*$" "$CONFIG"; then
              sed -i "s|^${key}=.*$|${cfg}|" "$CONFIG"
            elif grep -qE "^# ${key} is not set$" "$CONFIG"; then
              sed -i "s|^# ${key} is not set$|${cfg}|" "$CONFIG"
            else
              echo "$cfg" >> "$CONFIG"
            fi
          }
          echo "=== Required configs ==="
          for cfg in "${REQUIRED_CONFIGS[@]}"; do
            echo "Enabling: $cfg"
            set_config "$cfg"
          done
          if [ "${{ inputs.APPLY_OPTIONAL_CONFIG }}" = "true" ]; then
            echo
            echo "=== Optional configs ==="
            for cfg in "${OPTIONAL_CONFIGS[@]}"; do
              echo "Enabling: $cfg"
              set_config "$cfg"
            done
          else
            echo
            echo "Optional configs disabled."
          fi
          echo
          echo "=== Requested configuration ==="
          grep -E \
            '^CONFIG_(SYSVIPC|SYSVIPC_SYSCTL|POSIX_MQUEUE|IPC_NS|PID_NS|NET_NS|UTS_NS|USER_NS|CGROUPS|DEVTMPFS|NETFILTER_XT_MATCH_ADDRTYPE)=' \
            "$CONFIG" \
            || true
          echo
          echo "=== Defconfig diff ==="
          git diff -- \
            arch/arm64/configs/gki_defconfig \
            || true

      - name: "🔄 Update gki_defconfig with savedefconfig"
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"
          
          # 重新生成最小化的 gki_defconfig，解决 "savedefconfig does not match" 错误
          tools/bazel run //common:kernel_aarch64_config -- savedefconfig
          
          echo
          echo "=== Updated gki_defconfig (after savedefconfig) ==="
          git -C common diff --stat -- arch/arm64/configs/gki_defconfig || true
          git -C common diff -- arch/arm64/configs/gki_defconfig || true

      - name: "🔐 Verify GKI KMI Settings"
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"
          echo "=== KMI related settings ==="
          grep -R \
            -n \
            -E \
            'KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI|kmi_symbol_list_strict_mode' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -200 \
            || true
          echo
          echo "KMI strict checks are NOT disabled."

      - name: "🧪 Validate GKI Defconfig"
        shell: bash
        run: |
          set -euxo pipefail
          COMMON="$WORKSPACE/kernel_platform/common"
          VALIDATE_OUT="$WORKSPACE/gki-config-check"
          rm -rf "$VALIDATE_OUT"
          mkdir -p "$VALIDATE_OUT"
          cd "$COMMON"
          make \
            ARCH=arm64 \
            LLVM=1 \
            O="$VALIDATE_OUT" \
            gki_defconfig
          REQUIRED_FINAL_CONFIGS=(
            "SYSVIPC"
            "POSIX_MQUEUE"
            "IPC_NS"
            "PID_NS"
            "NET_NS"
            "UTS_NS"
            "USER_NS"
            "CGROUPS"
            "DEVTMPFS"
            "NETFILTER_XT_MATCH_ADDRTYPE"
          )
          echo
          echo "=== Validate generated .config ==="
          for cfg in "${REQUIRED_FINAL_CONFIGS[@]}"; do
            if ! grep -q "^CONFIG_${cfg}=y$" "$VALIDATE_OUT/.config"; then
              echo "ERROR: CONFIG_${cfg} is not enabled."
              grep \
                "^#\?CONFIG_${cfg}" \
                "$VALIDATE_OUT/.config" \
                || true
              exit 1
            fi
            echo "OK: CONFIG_${cfg}=y"
          done

      - name: "🔎 Inspect Kleaf GKI Targets"
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"
          echo "=== //common targets ==="
          tools/bazel query \
            '//common:*' \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/bazel-common-targets.txt"
          echo
          echo "=== Candidate GKI targets ==="
          grep -E \
            'kernel_aarch64_dist|kernel.*dist|gki' \
            "$GITHUB_WORKSPACE/bazel-common-targets.txt" \
            || true

      - name: "🧹 Clean Bazel Build"
        if: ${{ inputs.CLEAN_BUILD }}
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"
          tools/bazel clean
          rm -rf \
            "$ROOT/out/dist" \
            "$ROOT/out/common" \
            "$ROOT/out/bazel" \
            "$ROOT/out/.cache" \
            2>/dev/null || true

      - name: "🔨 Build PURE GKI Kernel"
        shell: bash
        run: |
          set -o pipefail
          ROOT="$WORKSPACE/kernel_platform"
          DEST="$GITHUB_WORKSPACE/Final-GKI-Image"
          mkdir -p "$DEST"
          cd "$ROOT"
          echo
          echo "========================================"
          echo "PURE GKI BUILD"
          echo "========================================"
          echo "Manifest : $MANIFEST_BRANCH"
          echo "XML      : $MANIFEST_FILE"
          echo
          echo "Build system:"
          echo "Kleaf / Bazel"
          echo
          echo "Target:"
          echo "//common:kernel_aarch64_dist"
          echo
          echo "Vendor wrapper:"
          echo "NOT USED"
          echo
          echo "Build type:"
          echo "PURE GKI"
          echo "========================================"
          echo
          tools/bazel run \
            //common:kernel_aarch64_dist \
            -- \
            --destdir="$DEST" \
            2>&1 \
            | tee "
