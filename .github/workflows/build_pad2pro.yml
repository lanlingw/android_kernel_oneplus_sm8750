name: Build SM8750 Pure GKI Kernel

on:
  workflow_dispatch:
    inputs:
      APPLY_OPTIONAL_CONFIG:
        description: "Enable optional Droidspaces GKI configs"
        required: false
        type: boolean
        default: false
      CLEAN_BUILD:
        description: "Clean Bazel/output before build"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: OnePlus Pad 2 Pro SM8750 Pure GKI
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      MANIFEST_BRANCH: oneplus/sm8750
      MANIFEST_FILE: oneplus_pad_2_pro_b.xml
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      # Bazel / Kleaf 常用优化
      BAZEL_ARGS: "--config=fast"
      USE_CCACHE: 1

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 12288          # 12GB 留给系统，避免过大导致可用空间不足
          temp-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Show free disk space
        run: df -h

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            python3 \
            python-is-python3 \
            git \
            curl \
            wget \
            ccache \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            zlib1g-dev \
            rsync \
            unzip \
            gawk \
            dos2unix \
            bc \
            libelf-dev \
            pkg-config \
            gcc-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            openjdk-17-jdk \
            android-sdk-libsparse-utils \
            lib32z1-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            xsltproc \
            yasm \
            cpio \
            repo \
            file \
            tree

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats || true
          ccache --show-config

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sm8750-pad2pro-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-sm8750-pad2pro-${{ runner.os }}-${{ runner.arch }}-
            ccache-sm8750-pad2pro-

      - name: Init Official OnePlus SM8750 Manifest
        shell: bash
        run: |
          set -euxo pipefail
          # 避免 repo 同步时的 git 警告
          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"
          git config --global color.ui false
          git config --global advice.detachedHead false

          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b "$MANIFEST_BRANCH" \
            -m "$MANIFEST_FILE" \
            --depth=1 \
            --no-repo-verify

      - name: Sync OnePlus Kernel Source
        shell: bash
        run: |
          set -euxo pipefail
          cd "$WORKSPACE"
          # 大仓库同步，增加稳定性参数
          repo sync \
            -c \
            -j"$(nproc --all)" \
            --no-tags \
            --no-clone-bundle \
            --force-sync \
            --fail-fast \
            --optimized-fetch \
            --prune
          test -d "$WORKSPACE/kernel_platform"
          echo "Sync completed. Disk usage:"
          du -sh "$WORKSPACE" || true

      - name: Verify GKI Source Tree
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          COMMON="$ROOT/common"
          test -d "$ROOT"
          test -d "$COMMON"
          test -f "$COMMON/BUILD.bazel"
          test -f "$COMMON/arch/arm64/configs/gki_defconfig"
          echo "=== Kernel version ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' "$COMMON/Makefile" || true
          echo "=== tools/bazel exists? ==="
          test -x "$ROOT/tools/bazel" && echo "Yes" || echo "No"

      - name: Fetch Droidspaces-OSS
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/Droidspaces-OSS
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS
          echo "Droidspaces-OSS commit: $(git -C /tmp/Droidspaces-OSS rev-parse HEAD)"

      - name: Locate & Apply Droidspaces SYSVIPC kABI Patch
        shell: bash
        run: |
          set -euxo pipefail
          PATCH_DIR="/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          test -d "$PATCH_DIR"

          # 优先使用官方推荐的 6_7_8 版本
          PATCH_FILE=""
          for candidate in \
            "001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" \
            "*sysvipc*kabi*6_7_8*.patch" \
            "*sysvipc*kabi*.patch"
          do
            found=$(find "$PATCH_DIR" -maxdepth 1 -type f -iname "$candidate" | head -n 1 || true)
            if [ -n "$found" ]; then
              PATCH_FILE="$found"
              break
            fi
          done

          if [ -z "$PATCH_FILE" ]; then
            echo "ERROR: SYSVIPC kABI patch not found under $PATCH_DIR"
            ls -la "$PATCH_DIR" || true
            exit 1
          fi

          echo "Selected patch: $PATCH_FILE"
          COMMON="$WORKSPACE/kernel_platform/common"
          cd "$COMMON"
          # 使用 --forward，已应用则跳过
          if patch --dry-run --forward -p1 < "$PATCH_FILE" > /dev/null 2>&1; then
            patch --forward -p1 < "$PATCH_FILE"
            echo "Patch applied successfully"
          else
            echo "Patch may already be applied or does not apply cleanly, checking..."
            patch --forward -p1 < "$PATCH_FILE" || {
              echo "WARNING: patch application had issues, continuing (may already applied)"
            }
          fi
          git diff --stat || true

      - name: Configure Droidspaces GKI Defconfig
        shell: bash
        run: |
          set -euxo pipefail
          COMMON="$WORKSPACE/kernel_platform/common"
          CONFIG="$COMMON/arch/arm64/configs/gki_defconfig"
          test -f "$CONFIG"
          cp "$CONFIG" "$CONFIG.bak"

          REQUIRED_CONFIGS=(
            "CONFIG_SYSVIPC=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_PID_NS=y"
            "CONFIG_DEVTMPFS=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          )

          OPTIONAL_CONFIGS=(
            "CONFIG_USER_NS=y"
            "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            "CONFIG_IP_SET=y"
            "CONFIG_IP_SET_HASH_IP=y"
            "CONFIG_IP_SET_HASH_NET=y"
            "CONFIG_NETFILTER_XT_SET=y"
            "CONFIG_TMPFS_POSIX_ACL=y"
            "CONFIG_TMPFS_XATTR=y"
          )

          set_config() {
            local cfg="$1"
            local key="${cfg%%=*}"
            if grep -qE "^${key}=y$" "$CONFIG"; then
              echo "[OK] Already enabled: $key"
              return 0
            fi
            if grep -qE "^# ${key} is not set$" "$CONFIG"; then
              sed -i "s|^# ${key} is not set$|${cfg}|" "$CONFIG"
              echo "[CHG] Changed to $cfg"
              return 0
            fi
            if grep -qE "^${key}=.*$" "$CONFIG"; then
              sed -i "s|^${key}=.*$|${cfg}|" "$CONFIG"
              echo "[UPD] Updated to $cfg"
              return 0
            fi
            echo "$cfg" >> "$CONFIG"
            echo "[ADD] Appended $cfg"
          }

          for cfg in "${REQUIRED_CONFIGS[@]}"; do
            set_config "$cfg"
          done

          if [ "${{ inputs.APPLY_OPTIONAL_CONFIG }}" = "true" ]; then
            echo "Applying optional configs..."
            for cfg in "${OPTIONAL_CONFIGS[@]}"; do
              set_config "$cfg"
            done
          else
            echo "Skipping optional configs"
          fi

          echo "=== Relevant configs after modification ==="
          grep -E '^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|NETFILTER_XT_MATCH_ADDRTYPE|USER_NS)=' "$CONFIG" || true
          echo "=== Diff ==="
          diff -u "$CONFIG.bak" "$CONFIG" || true

      - name: Disable check_defconfig
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"
          cp common/BUILD.bazel common/BUILD.bazel.bak

          python3 << 'PY'
          import re
          import sys

          with open("common/BUILD.bazel", "r") as f:
              content = f.read()

          # 匹配 kernel_aarch64 目标
          pattern = r'(name\s*=\s*"kernel_aarch64",)'
          replacement = r'\1\n    check_defconfig = "disabled",'

          new_content, count = re.subn(pattern, replacement, content, count=1)
          if count == 0:
              # 兜底：尝试更宽松的匹配
              pattern2 = r'(name\s*=\s*"kernel_aarch64")'
              replacement2 = r'\1,\n    check_defconfig = "disabled"'
              new_content, count = re.subn(pattern2, replacement2, content, count=1)
              if count == 0:
                  print("ERROR: Could not find kernel_aarch64 target in BUILD.bazel")
                  # 打印相关片段帮助调试
                  for i, line in enumerate(content.splitlines(), 1):
                      if "kernel_aarch64" in line:
                          print(f"{i}: {line}")
                  sys.exit(1)

          with open("common/BUILD.bazel", "w") as f:
              f.write(new_content)
          print("Successfully injected check_defconfig = \"disabled\"")
          PY

          echo "=== Verified snippet ==="
          grep -A 15 -E 'name\s*=\s*"kernel_aarch64"' common/BUILD.bazel || true

      - name: Clean Bazel Build
        if: ${{ inputs.CLEAN_BUILD }}
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"
          if [ -x tools/bazel ]; then
            tools/bazel clean --expunge || tools/bazel clean || true
          fi
          rm -rf out/dist out/common out/bazel out/.cache 2>/dev/null || true
          echo "Clean completed"

      - name: Build PURE GKI Kernel
        shell: bash
        run: |
          set -o pipefail
          ROOT="$WORKSPACE/kernel_platform"
          DEST="${GITHUB_WORKSPACE}/Final-GKI-Image"
          mkdir -p "$DEST"
          cd "$ROOT"

          echo "Starting pure GKI build..."
          echo "Free space before build:"
          df -h

          # 构建并实时输出日志
          tools/bazel run //common:kernel_aarch64_dist -- --destdir="$DEST" 2>&1 | tee "${GITHUB_WORKSPACE}/build-pure-gki.log"
          BUILD_EXIT=${PIPESTATUS[0]}

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "ERROR: Build failed with exit code $BUILD_EXIT"
            echo "=== Last 100 lines of log ==="
            tail -n 100 "${GITHUB_WORKSPACE}/build-pure-gki.log" || true
            exit "$BUILD_EXIT"
          fi

          echo "PURE GKI BUILD COMPLETED SUCCESSFULLY"
          echo "Free space after build:"
          df -h

      - name: Inspect GKI Artifacts
        if: always()
        shell: bash
        run: |
          set -u
          DEST="${GITHUB_WORKSPACE}/Final-GKI-Image"
          if [ ! -d "$DEST" ]; then
            echo "Artifact directory does not exist: $DEST"
            exit 1
          fi
          echo "=== Artifacts listing ==="
          find "$DEST" -type f -printf '%P\t%s bytes\n' | sort || true
          echo
          echo "=== Tree view (depth 2) ==="
          tree -L 2 "$DEST" 2>/dev/null || find "$DEST" -maxdepth 2 -print

      - name: Verify GKI Kernel Image
        if: always()
        shell: bash
        run: |
          set -u
          DEST="${GITHUB_WORKSPACE}/Final-GKI-Image"
          IMAGE_FOUND=0

          for file in \
            "$DEST/Image" \
            "$DEST/Image.gz" \
            "$DEST/Image.lz4" \
            "$DEST/Image.gz-dtb" \
            "$DEST/boot.img"
          do
            if [ -s "$file" ]; then
              echo "Found usable image: $file ($(du -h "$file" | cut -f1))"
              file "$file" || true
              IMAGE_FOUND=1
            fi
          done

          if [ "$IMAGE_FOUND" -eq 0 ]; then
            echo "ERROR: No usable GKI kernel image found in $DEST"
            echo "Full listing:"
            find "$DEST" -type f -printf '%P %s bytes\n' | sort || true
            exit 1
          fi
          echo "GKI artifact validation passed"

      - name: Generate Build Metadata
        if: always()
        shell: bash
        run: |
          set -u
          DEST="${GITHUB_WORKSPACE}/Final-GKI-Image"
          mkdir -p "$DEST"
          {
            echo "OnePlus Pad 2 Pro SM8750 Pure GKI"
            echo "================================="
            echo "Manifest branch : $MANIFEST_BRANCH"
            echo "Manifest file   : $MANIFEST_FILE"
            echo "Build system    : Kleaf / Bazel"
            echo "Build target    : //common:kernel_aarch64_dist"
            echo "check_defconfig : disabled"
            echo "Optional configs: ${{ inputs.APPLY_OPTIONAL_CONFIG }}"
            echo "Clean build     : ${{ inputs.CLEAN_BUILD }}"
            echo "Runner          : ${{ runner.os }} / ${{ runner.arch }}"
            echo "GitHub SHA      : ${{ github.sha }}"
            echo "Run ID          : ${{ github.run_id }}"
            echo
            echo "Droidspaces-OSS commit:"
            git -C /tmp/Droidspaces-OSS rev-parse HEAD 2>/dev/null || echo "N/A"
            echo
            echo "Kernel version info:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' \
              "$WORKSPACE/kernel_platform/common/Makefile" 2>/dev/null || true
          } > "$DEST/BUILD_INFO.txt"
          cat "$DEST/BUILD_INFO.txt"

      - name: Upload Pure GKI Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus_pad_2_pro_sm8750_pure_gki
          path: |
            Final-GKI-Image/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus_pad_2_pro_sm8750_pure_gki_logs
          path: |
            build-pure-gki.log
          if-no-files-found: warn
          retention-days: 14

      - name: ccache Statistics
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true
