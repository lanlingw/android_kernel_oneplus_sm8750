name: Build SM8750 Pure GKI Kernel
on:
  workflow_dispatch:
    inputs:
      APPLY_OPTIONAL_CONFIG:
        description: "Enable optional Droidspaces GKI configs"
        required: false
        type: boolean
        default: false
      CLEAN_BUILD:
        description: "Clean Bazel/output before build"
        required: false
        type: boolean
        default: true
jobs:
  build:
    name: OnePlus Pad 2 Pro SM8750 Pure GKI
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      MANIFEST_BRANCH: oneplus/sm8750
      MANIFEST_FILE: oneplus_pad_2_pro_b.xml
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
    steps:
      - name: "🚀 Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: "📦 Install Build Dependencies"
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python-is-python3 \
            git \
            curl \
            wget \
            ccache \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            zlib1g-dev \
            rsync \
            unzip \
            gawk \
            dos2unix \
            bc \
            libelf-dev \
            pkg-config \
            gcc-aarch64-linux-gnu \
            clang \
            lld \
            llvm \
            openjdk-17-jdk \
            android-sdk-libsparse-utils \
            lib32z1-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            xsltproc \
            yasm \
            cpio \
            repo
          python3 --version
          git --version
          repo --version || true
          clang --version
          ld.lld --version

      - name: "⚡ Configure ccache"
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --show-config

      - name: "📦 Restore ccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-sm8750-pad2pro-${{ github.run_id }}
          restore-keys: |
            ccache-sm8750-pad2pro-

      - name: "📥 Init Official OnePlus SM8750 Manifest"
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b "$MANIFEST_BRANCH" \
            -m "$MANIFEST_FILE" \
            --depth=1

      - name: "📥 Sync OnePlus Kernel Source"
        shell: bash
        run: |
          set -euxo pipefail
          cd "$WORKSPACE"
          repo sync \
            -c \
            -j"$(nproc --all)" \
            --no-tags \
            --no-clone-bundle \
            --force-sync
          test -d "$WORKSPACE/kernel_platform"
          ls -lah "$WORKSPACE/kernel_platform"

      - name: "🔎 Verify GKI Source Tree"
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          COMMON="$ROOT/common"
          test -d "$ROOT"
          test -d "$COMMON"
          test -f "$COMMON/BUILD.bazel"
          test -f "$COMMON/arch/arm64/configs/gki_defconfig"
          echo "ROOT   = $ROOT"
          echo "COMMON = $COMMON"
          echo
          echo "=== Kernel version ==="
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' \
            "$COMMON/Makefile" \
            || true
          echo
          echo "=== GKI files ==="
          find "$COMMON" \
            -maxdepth 2 \
            -type f \
            \( \
              -name 'build.config*' \
              -o -name 'BUILD.bazel' \
            \) \
            -print \
            | sort

      - name: "📥 Fetch Droidspaces-OSS"
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/Droidspaces-OSS
          git clone \
            --depth=1 \
            https://github.com/ravindu644/Droidspaces-OSS.git \
            /tmp/Droidspaces-OSS
          echo "Droidspaces revision:"
          git -C /tmp/Droidspaces-OSS rev-parse HEAD

      - name: "🩹 Locate Droidspaces SYSVIPC Patch"
        shell: bash
        run: |
          set -euxo pipefail
          PATCH_DIR="/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12"
          test -d "$PATCH_DIR"
          echo "Available patches:"
          find "$PATCH_DIR" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort
          PATCH_FILE="$(
            find "$PATCH_DIR" \
              -maxdepth 1 \
              -type f \
              -iname '*sysvipc*kabi*6_7_8*.patch' \
              | head -n 1
          )"
          if [ -z "$PATCH_FILE" ]; then
            echo "ERROR: SYSVIPC kABI patch not found."
            exit 1
          fi
          echo "PATCH_FILE=$PATCH_FILE" >> "$GITHUB_ENV"
          echo
          echo "Selected patch:"
          echo "$PATCH_FILE"

      - name: "🩹 Apply Droidspaces SYSVIPC kABI Patch"
        shell: bash
        run: |
          set -euxo pipefail
          COMMON="$WORKSPACE/kernel_platform/common"
          cd "$COMMON"
          echo "Applying patch:"
          echo "$PATCH_FILE"
          patch \
            --forward \
            -p1 \
            < "$PATCH_FILE"
          echo
          echo "=== Patch result ==="
          git diff --stat || true
          git diff --check || true

      - name: "⚙️ Configure Droidspaces GKI Defconfig (strict rules)"
        shell: bash
        run: |
          set -euxo pipefail
          COMMON="$WORKSPACE/kernel_platform/common"
          CONFIG="$COMMON/arch/arm64/configs/gki_defconfig"
          echo "COMMON = $COMMON"
          echo "CONFIG = $CONFIG"
          test -f "$CONFIG"

          # 严格按照 Droidspaces 文档推荐的 GKI 配置
          # 必须项
          REQUIRED_CONFIGS=(
            "CONFIG_SYSVIPC=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_PID_NS=y"
            "CONFIG_DEVTMPFS=y"
            "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
          )

          # 可选项（仅在输入开启时启用）
          OPTIONAL_CONFIGS=(
            "CONFIG_USER_NS=y"
            "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            "CONFIG_IP_SET=y"
            "CONFIG_IP_SET_HASH_IP=y"
            "CONFIG_IP_SET_HASH_NET=y"
            "CONFIG_NETFILTER_XT_SET=y"
            "CONFIG_TMPFS_POSIX_ACL=y"
            "CONFIG_TMPFS_XATTR=y"
          )

          # 严格遵循文档 Workflow Rules：
          # 1. 不整块追加
          # 2. 搜索现有行
          # 3. # is not set → 改成 =y
          # 4. 已是 =y → 跳过
          # 5. 完全不存在才追加到末尾
          set_config() {
            local cfg="$1"
            local key="${cfg%%=*}"

            if grep -qE "^${key}=y$" "$CONFIG"; then
              echo "Already enabled: $key"
              return 0
            fi

            if grep -qE "^# ${key} is not set$" "$CONFIG"; then
              sed -i "s|^# ${key} is not set$|${cfg}|" "$CONFIG"
              echo "Changed from 'is not set' → $cfg"
              return 0
            fi

            if grep -qE "^${key}=.*$" "$CONFIG"; then
              sed -i "s|^${key}=.*$|${cfg}|" "$CONFIG"
              echo "Updated existing: $cfg"
              return 0
            fi

            # 真正不存在才追加
            echo "$cfg" >> "$CONFIG"
            echo "Appended (not found): $cfg"
          }

          echo "=== Required configs ==="
          for cfg in "${REQUIRED_CONFIGS[@]}"; do
            set_config "$cfg"
          done

          if [ "${{ inputs.APPLY_OPTIONAL_CONFIG }}" = "true" ]; then
            echo
            echo "=== Optional configs ==="
            for cfg in "${OPTIONAL_CONFIGS[@]}"; do
              set_config "$cfg"
            done
          else
            echo
            echo "Optional configs disabled."
          fi

          echo
          echo "=== Current relevant configs ==="
          grep -E \
            '^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|DEVTMPFS|NETFILTER_XT_MATCH_ADDRTYPE|USER_NS)=' \
            "$CONFIG" \
            || true

          echo
          echo "=== Defconfig diff (before Bazel savedefconfig) ==="
          git -C "$COMMON" diff -- arch/arm64/configs/gki_defconfig || true

      - name: "🔄 Update gki_defconfig via Bazel savedefconfig"
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"

          # 使用 --config=local 让 Bazel 可以写回源树
          # 这是纯 Bazel 方式，不使用 make
          tools/bazel run \
            --config=local \
            //common:kernel_aarch64_config \
            -- \
            savedefconfig

          echo
          echo "=== Diff after Bazel savedefconfig ==="
          git -C common diff --stat -- arch/arm64/configs/gki_defconfig || true
          echo
          git -C common diff -- arch/arm64/configs/gki_defconfig || true

      - name: "🔐 Verify GKI KMI Settings"
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"
          echo "=== KMI related settings ==="
          grep -R \
            -n \
            -E \
            'KMI_SYMBOL_LIST_STRICT_MODE|TRIM_NONLISTED_KMI|kmi_symbol_list_strict_mode' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -200 \
            || true
          echo
          echo "KMI strict checks are NOT disabled."

      - name: "🧪 Validate GKI Defconfig (Bazel)"
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"

          # 用 Bazel 生成 config 并检查关键选项是否生效
          tools/bazel build \
            --config=local \
            //common:kernel_aarch64_config

          # 找到生成的 .config
          CONFIG_FILE=$(find bazel-bin -name ".config" -path "*/common/*" | head -n 1 || true)
          if [ -z "$CONFIG_FILE" ]; then
            echo "WARNING: Could not locate generated .config, skip detailed check"
            exit 0
          fi

          echo "Using generated config: $CONFIG_FILE"
          REQUIRED_FINAL_CONFIGS=(
            "SYSVIPC"
            "POSIX_MQUEUE"
            "IPC_NS"
            "PID_NS"
            "DEVTMPFS"
            "NETFILTER_XT_MATCH_ADDRTYPE"
          )

          echo
          echo "=== Validate generated .config ==="
          for cfg in "${REQUIRED_FINAL_CONFIGS[@]}"; do
            if ! grep -q "^CONFIG_${cfg}=y$" "$CONFIG_FILE"; then
              echo "ERROR: CONFIG_${cfg} is not enabled."
              grep -E "^#?CONFIG_${cfg}" "$CONFIG_FILE" || true
              exit 1
            fi
            echo "OK: CONFIG_${cfg}=y"
          done

      - name: "🔎 Inspect Kleaf GKI Targets"
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"
          echo "=== //common targets ==="
          tools/bazel query \
            '//common:*' \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/bazel-common-targets.txt"
          echo
          echo "=== Candidate GKI targets ==="
          grep -E \
            'kernel_aarch64_dist|kernel.*dist|gki' \
            "$GITHUB_WORKSPACE/bazel-common-targets.txt" \
            || true

      - name: "🧹 Clean Bazel Build"
        if: ${{ inputs.CLEAN_BUILD }}
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$WORKSPACE/kernel_platform"
          cd "$ROOT"
          tools/bazel clean
          rm -rf \
            "$ROOT/out/dist" \
            "$ROOT/out/common" \
            "$ROOT/out/bazel" \
            "$ROOT/out/.cache" \
            2>/dev/null || true

      - name: "🔨 Build PURE GKI Kernel"
        shell: bash
        run: |
          set -o pipefail
          ROOT="$WORKSPACE/kernel_platform"
          DEST="$GITHUB_WORKSPACE/Final-GKI-Image"
          mkdir -p "$DEST"
          cd "$ROOT"
          echo
          echo "========================================"
          echo "PURE GKI BUILD"
          echo "========================================"
          echo "Manifest : $MANIFEST_BRANCH"
          echo "XML      : $MANIFEST_FILE"
          echo
          echo "Build system:"
          echo "Kleaf / Bazel"
          echo
          echo "Target:"
          echo "//common:kernel_aarch64_dist"
          echo
          echo "Vendor wrapper:"
          echo "NOT USED"
          echo
          echo "Build type:"
          echo "PURE GKI"
          echo "========================================"
          echo
          tools/bazel run \
            //common:kernel_aarch64_dist \
            -- \
            --destdir="$DEST" \
            2>&1 \
            | tee "$GITHUB_WORKSPACE/build-pure-gki.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo
            echo "ERROR: Pure GKI build failed."
            echo "Exit code: $BUILD_EXIT"
            exit "$BUILD_EXIT"
          fi
          echo
          echo "PURE GKI BUILD COMPLETED."

      - name: "📦 Inspect GKI Artifacts"
        if: always()
        shell: bash
        run: |
          set -u
          DEST="$GITHUB_WORKSPACE/Final-GKI-Image"
          echo "========================================"
          echo "GKI ARTIFACTS"
          echo "========================================"
          if [ ! -d "$DEST" ]; then
            echo "Artifact directory does not exist."
            exit 1
          fi
          find "$DEST" \
            -type f \
            -printf '%P %s bytes\n' \
            | sort \
            || true

      - name: "🧪 Verify GKI Kernel Image"
        if: always()
        shell: bash
        run: |
          set -u
          DEST="$GITHUB_WORKSPACE/Final-GKI-Image"
          IMAGE_FOUND=0
          for file in \
            "$DEST/Image" \
            "$DEST/Image.lz4" \
            "$DEST/Image.gz" \
            "$DEST/Image.gz-dtb" \
            "$DEST/boot.img"
          do
            if [ -s "$file" ]; then
              echo "Found kernel artifact:"
              echo "$file"
              IMAGE_FOUND=1
            fi
          done
          if [ "$IMAGE_FOUND" -eq 0 ]; then
            echo
            echo "ERROR: No usable GKI kernel image found."
            find "$DEST" \
              -type f \
              -printf '%P %s bytes\n' \
              | sort \
              || true
            exit 1
          fi
          echo
          echo "GKI artifact validation passed."

      - name: "📝 Generate Build Metadata"
        if: always()
        shell: bash
        run: |
          set -u
          DEST="$GITHUB_WORKSPACE/Final-GKI-Image"
          mkdir -p "$DEST"
          {
            echo "========================================"
            echo "OnePlus Pad 2 Pro SM8750 Pure GKI"
            echo "========================================"
            echo
            echo "Manifest branch : $MANIFEST_BRANCH"
            echo "Manifest file   : $MANIFEST_FILE"
            echo
            echo "Build system    : Kleaf / Bazel"
            echo "Build target    : //common:kernel_aarch64_dist"
            echo "Build type      : PURE GKI"
            echo
            echo "OnePlus wrapper : NOT USED"
            echo "Vendor build    : NOT USED"
            echo
            echo "Optional configs: ${{ inputs.APPLY_OPTIONAL_CONFIG }}"
            echo
            echo "Droidspaces revision:"
            git -C /tmp/Droidspaces-OSS rev-parse HEAD \
              2>/dev/null || true
            echo
            echo "Source revisions:"
            cd "$WORKSPACE"
            repo forall -c \
              'printf "%s " "$REPO_PATH"; git rev-parse HEAD' \
              2>/dev/null \
              | sort \
              | head -500 \
              || true
          } > "$DEST/BUILD_INFO.txt"

      - name: "📤 Upload Pure GKI Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus_pad_2_pro_sm8750_pure_gki
          path: |
            Final-GKI-Image/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: "📤 Upload Build Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus_pad_2_pro_sm8750_pure_gki_logs
          path: |
            build-pure-gki.log
            bazel-common-targets.txt
          if-no-files-found: warn
          retention-days: 14

      - name: "📊 ccache Statistics"
        if: always()
        shell: bash
        run: |
          ccache --show-stats || true
