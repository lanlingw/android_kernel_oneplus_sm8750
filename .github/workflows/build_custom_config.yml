name: Build Custom Config GKI Kernel

on:
  workflow_dispatch:
    inputs:
      CONFIG_CHANGES:
        description: '需要修改/开启的 CONFIG (多个用空格隔开，如 CONFIG_BPF_SYSCALL=y CONFIG_KPROBES=y)'
        required: true
        default: 'CONFIG_BPF_SYSCALL=y'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@v10
      with:
        root-reserve-mb: 4096
        swap-size-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Install All Kernel Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev libelf-dev \
          cpio zip unzip git wget clang lld python3 python3-pip python-is-python3 \
          libncurses5-dev libtinfo5 dwarves lz4 zstd libfl-dev libffi-dev raw2elf \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu crossbuild-essential-arm64 \
          device-tree-compiler libcap-dev libmpc-dev libgmp-dev libmpfr-dev \
          rsync kmod m4 libsqlite3-dev
        
        # 补全高通 DTS 与内核脚本所需的 Python 依赖库
        pip3 install --break-system-packages pyyaml jinja2 ply

    - name: Checkout Forked Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup AOSP Clang 18 Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xzf clang-r522817.tar.gz -C $GITHUB_WORKSPACE/clang
        rm clang-r522817.tar.gz

    - name: Locate Kernel Source Root
      run: |
        # 搜寻 gki_defconfig 所在的实际相对路径
        GKI_DEFCONFIG_PATH=$(find $GITHUB_WORKSPACE -name "gki_defconfig" -type f | head -n 1)
        
        if [ -z "$GKI_DEFCONFIG_PATH" ]; then
          echo "::error::当前仓库中没有找到 gki_defconfig！这说明该仓库仅包含 Vendor 驱动/模块，不包含 GKI 内核源码。"
          exit 1
        fi

        # 根据 gki_defconfig (arch/arm64/configs/gki_defconfig) 向上反推出 Linux 内核根目录
        REAL_KDIR=$(dirname $(dirname $(dirname $(dirname "$GKI_DEFCONFIG_PATH"))))
        echo "REAL_KDIR=$REAL_KDIR" >> $GITHUB_ENV
        echo "探测到内核源码根目录位于: $REAL_KDIR"

    - name: Inject Custom Configs
      run: |
        cd ${{ env.REAL_KDIR }}

        export ARCH=arm64
        # 1. 生成官方 GKI 基础配置
        make ARCH=arm64 gki_defconfig

        # 2. 彻底禁用阻碍自定义 CONFIG 编译的 KMI 白名单校验
        ./scripts/config --file .config --disable CONFIG_TRIM_UNUSED_KSYMS || true
        ./scripts/config --file .config --disable CONFIG_UNUSED_KSYMS_WHITELIST || true
        ./scripts/config --file .config --disable CONFIG_SECTION_MISMATCH_WARN_ONLY || true

        # 3. 解析并注入自定义 CONFIG 参数
        CONFIG_LIST="${{ inputs.CONFIG_CHANGES }}"
        echo "Injecting Custom Configs: $CONFIG_LIST"
        for item in $CONFIG_LIST; do
          KEY=$(echo $item | cut -d'=' -f1)
          VAL=$(echo $item | cut -d'=' -f2)
          if [ "$VAL" = "y" ]; then
            ./scripts/config --file .config --enable "$KEY"
          elif [ "$VAL" = "n" ]; then
            ./scripts/config --file .config --disable "$KEY"
          elif [ "$VAL" = "m" ]; then
            ./scripts/config --file .config --module "$KEY"
          else
            ./scripts/config --file .config --set-val "$KEY" "$VAL"
          fi
        done

        # 4. 刷新依赖关系
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

    - name: Compile Custom Kernel Image
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        cd ${{ env.REAL_KDIR }}

        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export LLVM=1
        export LLVM_IAS=1
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-

        # 编译纯内核 Image
        make -j$(nproc) ARCH=arm64 LLVM=1 LLVM_IAS=1 KCFLAGS="-w" Image

    - name: Pack and Upload Artifact
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        IMAGE_PATH=$(find ${{ env.REAL_KDIR }} -name "Image" -type f | head -n 1)
        if [ -n "$IMAGE_PATH" ]; then
          echo "Image 编译成功，位于: $IMAGE_PATH"
          cp "$IMAGE_PATH" $GITHUB_WORKSPACE/output/
          cd $GITHUB_WORKSPACE/output
          zip -r Custom_Config_GKI_Image.zip Image
        else
          echo "Error: 未能找到编译出的 Image 文件，编译中断！"
          exit 1
        fi

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Config-GKI-Kernel
        path: $GITHUB_WORKSPACE/output/Custom_Config_GKI_Image.zip
