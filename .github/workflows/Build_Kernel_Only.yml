name: Build OnePlus Pad 2 Pro GKI Kernel (Official)

on:
  workflow_dispatch:
    inputs:
      CUSTOM_CONFIG:
        description: "自定义内核配置选项 (逗号分隔，格式: CONFIG_XXX=y,CONFIG_YYY=y)"
        required: false
        type: string
        default: "CONFIG_SYSVIPC=y,CONFIG_POSIX_MQUEUE=y,CONFIG_IPC_NS=y,CONFIG_PID_NS=y"

jobs:
  build:
    name: Build GKI Kernel (android15-6.6)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G

    steps:
      - name: "🚀 Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "📦 Cache & Install Dependencies"
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix bc clang lld llvm
          execute_install_scripts: true

      - name: "🔧 Install newer LLVM/Clang"
        run: |
          echo "📋 检查可用 LLVM 版本..."
          apt-cache search llvm | grep -E "llvm-[0-9]+" | sort
          echo "📋 检查可用 Clang 版本..."
          apt-cache search clang | grep -E "clang-[0-9]+" | sort

          echo "🔧 安装 LLVM 15/18..."
          sudo apt-get install -y llvm-15 llvm-15-dev clang-15 lld-15 2>/dev/null || \
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 lld-18 2>/dev/null || \
          echo "⚠️ 无法安装预编译 LLVM，使用系统默认"

          echo "📋 当前编译器版本:"
          clang --version | head -1
          ld.lld --version | head -1
          which llvm-objcopy 2>/dev/null || echo "llvm-objcopy 未找到"
          which llvm-strip 2>/dev/null || echo "llvm-strip 未找到"

      - name: "📥 Clone GKI Kernel Source"
        run: |
          echo "⬇️ 克隆 OnePlus 官方 GKI 内核源码..."
          git clone --depth=1 -b oneplus/sm8750_b_16.0.0_pad_2_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750.git \
            kernel
          echo "✅ 克隆完成"
          cd kernel
          echo "📋 内核版本:"
          head -5 Makefile

      - name: "⚙️ Setup Cache Env"
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_pad2pro" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_pad2pro"

      - name: "💾 Restore ccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-pad2pro-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-pad2pro

      - name: "⚙️ Initialize ccache"
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: "🔨 Build GKI Kernel"
        run: |
          cd kernel

          echo "🔧 设置编译环境..."
          export KBUILD_BUILD_USER="OnePlus"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          export PATH="/usr/lib/ccache:$PATH"

          echo "📋 编译器版本:"
          clang --version | head -2
          ld.lld --version 2>/dev/null || ld.lld-15 --version 2>/dev/null || echo "⚠️ ld.lld 未找到"

          echo ""
          echo "🔧 步骤1: 生成 gki_defconfig..."
          make -j$(nproc --all) \
            LLVM=1 \
            ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            O=out \
            gki_defconfig 2>&1 | tail -10

          echo ""
          echo "🔧 步骤2: 添加自定义内核配置..."
          echo '${{ github.event.inputs.CUSTOM_CONFIG }}' | tr ',' '\n' | grep -v "^$" >> out/.config
          echo "📋 已追加的自定义配置:"
          echo '${{ github.event.inputs.CUSTOM_CONFIG }}' | tr ',' '\n' | grep -v "^$"
          make -j$(nproc --all) \
            LLVM=1 \
            ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            O=out \
            olddefconfig 2>&1 | tail -5

          echo ""
          echo "🔧 步骤3: 编译内核..."
          make -j$(nproc --all) \
            LLVM=1 \
            ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            O=out \
            2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          ccache -s
          echo ""

          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ 编译成功!"
            echo "📦 Image 大小: $(du -h out/arch/arm64/boot/Image | cut -f1)"
            echo "📦 Image.gz 大小: $(du -h out/arch/arm64/boot/Image.gz 2>/dev/null | cut -f1 || echo 'N/A')"
          else
            echo "❌ 编译失败 (exit code: $BUILD_EXIT)"
            echo "=== 错误信息 ==="
            grep -E "(Error|error:|FAILED|fatal)" build.log | tail -30
            echo ""
            echo "=== 最后 30 行日志 ==="
            tail -30 build.log
            exit 1
          fi

          echo ""
          echo "📋 检查自定义内核配置是否生效..."
          IFS=',' read -ra CFG_ARRAY <<< '${{ github.event.inputs.CUSTOM_CONFIG }}'
          for item in "${CFG_ARRAY[@]}"; do
            [ -z "$item" ] && continue
            cfg=$(echo "$item" | cut -d= -f1)
            result=$(grep "^$cfg=" out/.config 2>/dev/null || grep "# $cfg is not set" out/.config 2>/dev/null || echo "NOT FOUND")
            echo "  $result"
          done

      - name: "📦 Collect Kernel Images"
        run: |
          cd kernel

          mkdir -p Final-Image

          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image Final-Image/Image
            echo "✅ Image 已复制"
          fi

          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz Final-Image/Image.gz
            echo "✅ Image.gz 已复制"
          fi

          if [ -f "out/arch/arm64/boot/Image.lz4" ]; then
            cp out/arch/arm64/boot/Image.lz4 Final-Image/Image.lz4
            echo "✅ Image.lz4 已复制"
          fi

          echo ""
          echo "📋 导出完整内核配置文件..."
          cp out/.config Final-Image/kernel.config
          echo "✅ kernel.config 已保存"

          echo ""
          echo "📦 最终产物:"
          ls -lh Final-Image/

      - name: "📤 Upload Kernel Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: kernel_pad2pro_official
          path: kernel/Final-Image/*
          retention-days: 7

      - name: "📤 Upload Build Log (on failure)"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build_log_pad2pro
          path: kernel/build.log
          retention-days: 3
