name: Build OnePlus Pad 2 Pro Kernel (Droidspaces GKI Enabled)

on:
  workflow_dispatch:
    inputs:
      TARGET:
        description: "Kleaf target（官方 README：sun）"
        required: false
        type: string
        default: "sun"
      VARIANT:
        description: "Kleaf variant（官方 README：perf）"
        required: false
        type: string
        default: "perf"

jobs:
  build:
    name: Build ${{ inputs.TARGET || 'sun' }} ${{ inputs.VARIANT || 'perf' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    env:
      TARGET: ${{ inputs.TARGET || 'sun' }}
      VARIANT: ${{ inputs.VARIANT || 'perf' }}
      WORKSPACE: kernel_workspace

    steps:
      - name: "🚀 Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "📦 Install Build Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python-is-python3 git curl wget ccache \
            build-essential flex bison libssl-dev libncurses-dev zlib1g-dev \
            rsync unzip gawk dos2unix bc \
            libelf-dev pkg-config gcc-aarch64-linux-gnu clang lld llvm \
            openjdk-17-jdk android-sdk-libsparse-utils \
            libncurses-dev lib32z1-dev libxml2-utils lzop pngcrush \
            schedtool squashfs-tools xsltproc yasm cpio

      - name: "📥 Install Repo Tool"
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          repo --version

      - name: "📥 Init & Sync Official OnePlus Manifest"
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8750 \
            -m oneplus_pad_2_pro_b.xml \
            --depth=1

          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --force-sync

      - name: "🩹 Apply Official Droidspaces kABI Patch (Below 6.12)"
        run: |
          set -euo pipefail
          
          echo "⬇️ Cloning Droidspaces-OSS to fetch mandatory kABI patches..."
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS
          
          # 一加平板2Pro (SM8750) 搭载的是 Linux 6.6 内核，对应官方推荐补丁
          PATCH_FILE="/tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kABI_6_7_8.patch"
          
          cd "$WORKSPACE/kernel_platform/common"
          
          if [ -f "$PATCH_FILE" ]; then
            echo "✅ Applying 001.GKI-below-6.12-fix_sysvipc_kABI_6_7_8.patch ..."
            patch -p1 < "$PATCH_FILE"
          else
            echo "❌ Error: Required kABI patch file not found!"
            exit 1
          fi

      - name: "⚙️ Edit gki_defconfig for Droidspaces (Strict Rule Compliant)"
        run: |
          set -euo pipefail
          cd "$WORKSPACE/kernel_platform/common"
          
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          
          # 严格遵照文档：逐个检索配置项，避免直接在末尾盲目追加导致 Bazel 校验报错
          CONFIGS=(
            "CONFIG_SYSVIPC=y"
            "CONFIG_SYSVIPC_SYSCTL=y"
            "CONFIG_POSIX_MQUEUE=y"
            "CONFIG_IPC_NS=y"
            "CONFIG_PID_NS=y"
            "CONFIG_NET_NS=y"
            "CONFIG_UTS_NS=y"
            "CONFIG_USER_NS=y"
            "CONFIG_CGROUPS=y"
            "CONFIG_CGROUP_DEVICE=y"
            "CONFIG_CGROUP_FREEZER=y"
            "CONFIG_CGROUP_SCHED=y"
            "CONFIG_CPUSETS=y"
            "CONFIG_MEMCG=y"
            "CONFIG_VETH=y"
            "CONFIG_MACVLAN=y"
            "CONFIG_BRIDGE=y"
            "CONFIG_NETFILTER_XT_MATCH_COMMENT=y"
            "CONFIG_IP_NF_TARGET_MASQUERADE=y"
            "CONFIG_BINFMT_MISC=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_FUSE_FS=y"
          )
          
          echo "📝 Safely updating $CONFIG_FILE..."
          for cfg in "${CONFIGS[@]}"; do
            key="${cfg%=*}"
            if grep -q "^# ${key} is not set" "$CONFIG_FILE"; then
              sed -i "s|^# ${key} is not set|${cfg}|g" "$CONFIG_FILE"
              echo "  -> Enabled: $key"
            elif grep -q "^${cfg}" "$CONFIG_FILE"; then
              echo "  -> Already set: $key"
            else
              echo "${cfg}" >> "$CONFIG_FILE"
              echo "  -> Appended: $key"
            fi
          done

      - name: "🩹 Apply General Kleaf & kABI Workarounds"
        run: |
          set -euo pipefail
          cd "$WORKSPACE/kernel_platform"

          # 强制禁用编译系统中的 kABI 严格校验与裁减标志
          find . -name "build.config.gki*" -exec sed -i 's/KMI_SYMBOL_LIST_STRICT_MODE=1/KMI_SYMBOL_LIST_STRICT_MODE=0/g' {} + || true
          find . -name "build.config.gki*" -exec sed -i 's/TRIM_NONLISTED_KMI=1/TRIM_NONLISTED_KMI=0/g' {} + || true

          # 修改 Kleaf BUILD.bazel 规则，停用严格符号校验
          python3 - << 'PYEOF'
          import os
          common_build = "common/BUILD.bazel"
          if os.path.exists(common_build):
              with open(common_build, "r") as f:
                  content = f.read()
              content = content.replace("kmi_symbol_list_strict_mode = True", "kmi_symbol_list_strict_mode = False")
              with open(common_build, "w") as f:
                  f.write(content)
              print("✅ Patched common/BUILD.bazel for kABI compliance")
          PYEOF

      - name: "🔨 Build Kernel with Vendor Modules"
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          export EXTRA_KBUILD_ARGS="--skip_abi --kmi_symbol_list_strict_mode=false"
          export TRIM_NONLISTED_KMI=0

          ./kernel_platform/oplus/build/oplus_build_kernel.sh "${TARGET}" "${VARIANT}" 2>&1 | tee "$GITHUB_WORKSPACE/build-kernel-${TARGET}-${VARIANT}.log"

      - name: "📦 Collect dist artifacts"
        if: always()
        run: |
          set -euo pipefail
          DIST="$WORKSPACE/kernel_platform/out/msm-kernel-${TARGET}-${VARIANT}/dist"
          DEST="$GITHUB_WORKSPACE/Final-Image"
          mkdir -p "$DEST/modules" "$DEST/dtb"

          if [ ! -d "$DIST" ]; then
            echo "dist directory missing, nothing to collect"
            exit 0
          fi

          for f in boot.img init_boot.img vendor_boot.img vendor_dlkm.img dtbo.img Image Image.gz Image.lz4 \
                   vmlinux System.map .config; do
            if [ -f "$DIST/$f" ]; then
              cp "$DIST/$f" "$DEST/$(basename "$f")"
            fi
          done

          cp "$DIST"/*.dtb "$DEST/dtb/" 2>/dev/null || true
          cp "$DIST"/*.dtbo "$DEST/dtb/" 2>/dev/null || true
          cp "$DIST"/*.ko "$DEST/modules/" 2>/dev/null || true
          cp "$DIST"/modules.load "$DEST/" 2>/dev/null || true
          cp "$DIST"/vendor_dlkm.modules.load "$DEST/" 2>/dev/null || true

          echo "Artifact layout:"
          find "$DEST" -maxdepth 2 -type f | sort | sed 's#^# - #' || true

      - name: "📤 Upload Kernel Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel_pad2pro_${{ env.TARGET }}_${{ env.VARIANT }}
          path: |
            Final-Image
          retention-days: 7

      - name: "📤 Upload Build Log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log_pad2pro_${{ env.TARGET }}_${{ env.VARIANT }}
          path: |
            build-kernel-${{ env.TARGET }}-${{ env.VARIANT }}.log
          retention-days: 3
