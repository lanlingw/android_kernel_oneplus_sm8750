name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      TARGET:
        description: "Kleaf target（官方 README：sun）"
        required: false
        type: string
        default: "sun"
      VARIANT:
        description: "Kleaf variant（官方 README：perf）"
        required: false
        type: string
        default: "perf"

jobs:
  build:
    name: Build ${{ inputs.TARGET || 'sun' }} ${{ inputs.VARIANT || 'perf' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    env:
      TARGET: ${{ inputs.TARGET || 'sun' }}
      VARIANT: ${{ inputs.VARIANT || 'perf' }}
      WORKSPACE: kernel_workspace

    steps:
      - name: "🚀 Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "📦 Install Build Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python-is-python3 git curl wget ccache \
            build-essential flex bison libssl-dev libncurses-dev zlib1g-dev \
            rsync unzip gawk dos2unix bc \
            libelf-dev pkg-config gcc-aarch64-linux-gnu clang lld llvm \
            openjdk-17-jdk android-sdk-libsparse-utils \
            libncurses-dev lib32z1-dev libxml2-utils lzop pngcrush \
            schedtool squashfs-tools xsltproc yasm cpio

      - name: "📥 Install Repo Tool"
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          repo --version

      - name: "📥 Init & Sync Official OnePlus Manifest"
        run: |
          set -euo pipefail
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8750 \
            -m oneplus_pad_2_pro_b.xml \
            --depth=1

          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --force-sync

          echo "workspace root:"
          ls -la
          echo "kernel_platform:"
          ls -la kernel_platform/

      - name: "🔨 Build Kernel with Vendor Modules"
        run: |
          set -euo pipefail
          cd "$WORKSPACE"

          # 禁用 KMI 符号裁剪与 ABI 严格校验
          export EXTRA_KBUILD_ARGS="--skip_abi --kmi_symbol_list_strict_mode=false"
          export TRIM_NONLISTED_KMI=0

          ./kernel_platform/oplus/build/oplus_build_kernel.sh "${TARGET}" "${VARIANT}" 2>&1 | tee "$GITHUB_WORKSPACE/build-kernel-${TARGET}-${VARIANT}.log"

      - name: "📦 Collect dist artifacts"
        if: always()
        run: |
          set -euo pipefail
          DIST="$WORKSPACE/kernel_platform/out/msm-kernel-${TARGET}-${VARIANT}/dist"
          DEST="$GITHUB_WORKSPACE/Final-Image"
          mkdir -p "$DEST/modules" "$DEST/dtb"

          if [ ! -d "$DIST" ]; then
            echo "dist directory missing, nothing to collect"
            exit 0
          fi

          for f in boot.img init_boot.img vendor_boot.img vendor_dlkm.img dtbo.img Image Image.gz Image.lz4 \
                   vmlinux System.map .config; do
            if [ -f "$DIST/$f" ]; then
              cp "$DIST/$f" "$DEST/$(basename "$f")"
            fi
          done

          cp "$DIST"/*.dtb "$DEST/dtb/" 2>/dev/null || true
          cp "$DIST"/*.dtbo "$DEST/dtb/" 2>/dev/null || true
          cp "$DIST"/*.ko "$DEST/modules/" 2>/dev/null || true
          cp "$DIST"/modules.load "$DEST/" 2>/dev/null || true
          cp "$DIST"/vendor_dlkm.modules.load "$DEST/" 2>/dev/null || true

          echo "Artifact layout:"
          find "$DEST" -maxdepth 2 -type f | sort | sed 's#^# - #' || true

      - name: "📤 Upload Kernel Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel_pad2pro_${{ env.TARGET }}_${{ env.VARIANT }}
          path: |
            Final-Image
          retention-days: 7

      - name: "📤 Upload Build Log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log_pad2pro_${{ env.TARGET }}_${{ env.VARIANT }}
          path: |
            build-kernel-${{ env.TARGET }}-${{ env.VARIANT }}.log
          retention-days: 3
