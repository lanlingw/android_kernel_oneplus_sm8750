name: Build OnePlus Pad 2 Pro Kernel (Official - Bazel)

on:
  workflow_dispatch:
    inputs:
      CUSTOM_CONFIG:
        description: "自定义内核配置选项 (逗号分隔)"
        required: false
        type: string
        default: "CONFIG_SYSVIPC=y,CONFIG_POSIX_MQUEUE=y,CONFIG_IPC_NS=y,CONFIG_PID_NS=y"

jobs:
  build:
    name: Build Kernel via Bazel/Kleaf
    runs-on: ubuntu-latest
    timeout-minutes: 480

    env:
      CCACHE_MAXSIZE: 8G

    steps:
      - name: "🚀 Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "📦 Cache & Install Dependencies"
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev zlib1g-dev rsync unzip gawk dos2unix bc openjdk-17-jdk
          execute_install_scripts: true

      - name: "📥 Install Repo Tool"
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          echo "✅ repo 工具安装完成"

      - name: "📥 Init & Sync All Repos"
        run: |
          echo "📋 初始化仓库清单..."
          mkdir kernel_workspace && cd kernel_workspace

          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
                    -b oneplus/sm8750 \
                    -m oneplus_pad_2_pro_b.xml \
                    --depth=1

          echo "🔄 同步所有仓库 (约 35 个)..."
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

          echo "✅ 仓库同步完成"
          echo ""
          echo "📂 工作区结构:"
          ls -la
          echo ""
          echo "📂 kernel_platform:"
          ls -la kernel_platform/
          echo ""
          echo "📂 prebuilts/clang:"
          ls kernel_platform/prebuilts/clang/host/linux-x86/ 2>/dev/null | head -10
          echo ""
          echo "📂 build:"
          ls kernel_platform/build/ 2>/dev/null

      - name: "🔍 Check Build Dependencies"
        run: |
          cd kernel_workspace

          echo "📋 检查关键文件和目录..."
          echo ""
          echo "--- build/build.sh ---"
          ls -la kernel_platform/build/build.sh 2>/dev/null || echo "⚠️ build.sh 不存在"

          echo ""
          echo "--- build/kernel/kleaf ---"
          ls kernel_platform/build/kernel/kleaf/ 2>/dev/null | head -10 || echo "⚠️ kleaf 不存在"

          echo ""
          echo "--- build/config.sh ---"
          ls kernel_platform/build/config.sh 2>/dev/null || echo "⚠️ config.sh 不存在"

          echo ""
          echo "--- msm-kernel build.config.msm.sun ---"
          ls kernel_platform/msm-kernel/build.config.msm.sun 2>/dev/null || echo "⚠️ 不存在"

          echo ""
          echo "--- defconfig ---"
          ls kernel_platform/msm-kernel/arch/arm64/configs/ 2>/dev/null | head -10

      - name: "🔧 Setup Cache Env"
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_pad2pro" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_pad2pro"

      - name: "💾 Restore ccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-bazel-${{ runner.os }}-pad2pro-${{ github.run_id }}
          restore-keys: |
            ccache-bazel-${{ runner.os }}-pad2pro

      - name: "⚙️ Initialize ccache"
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: "🔧 Apply Custom Kernel Config"
        run: |
          cd kernel_workspace/kernel_platform

          echo "📋 添加自定义内核配置..."
          echo '${{ github.event.inputs.CUSTOM_CONFIG }}' | tr ',' '\n' | grep -v '^$' >> msm-kernel/arch/arm64/configs/gki_defconfig

          echo "✅ 已追加的配置:"
          echo '${{ github.event.inputs.CUSTOM_CONFIG }}' | tr ',' '\n' | grep -v '^$'

          echo ""
          echo "📋 检查 gki_defconfig 末尾:"
          tail -10 msm-kernel/arch/arm64/configs/gki_defconfig

      - name: "🔨 Build Kernel + Modules (Skip OPLUS)"
        run: |
          cd kernel_workspace/kernel_platform

          echo "🔧 设置环境变量..."
          export KBUILD_BUILD_USER="OnePlus"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          # 查找 Clang
          CLANG_BIN=$(find prebuilts/clang -name "clang" -type f 2>/dev/null | head -1)
          if [ -n "$CLANG_BIN" ]; then
            CLANG_DIR=$(dirname "$CLANG_BIN")
            echo "✅ 使用预编译 Clang: $CLANG_DIR"
          else
            CLANG_DIR="/usr/bin"
            echo "⚠️ 使用系统 Clang"
          fi

          # 查找 LLD (ld.lld)
          LLD_BIN=$(find prebuilts/clang -name "ld.lld*" -type f 2>/dev/null | head -1)
          if [ -n "$LLD_BIN" ]; then
            LLD_DIR=$(dirname "$LLD_BIN")
            echo "✅ 找到 LLD: $LLD_BIN"
            # 创建 ld.lld 别名
            if [ ! -f "$LLD_DIR/ld.lld" ] && [ -f "$LLD_DIR/ld.lld-18" ]; then
              ln -sf "$LLD_DIR/ld.lld-18" "$LLD_DIR/ld.lld"
            fi
          else
            echo "⚠️ 使用系统 LLD"
            which ld.lld 2>/dev/null || echo "⚠️ ld.lld 未找到，将使用系统 ld"
            LD_BIN=$(which ld.lld 2>/dev/null || which ld)
          fi

          # 查找 GCC 交叉编译器
          GCC_BIN=$(find prebuilts/gcc -name "aarch64-linux-gnu-gcc" -type f 2>/dev/null | head -1)
          if [ -n "$GCC_BIN" ]; then
            GCC_DIR=$(dirname "$GCC_BIN")
            export CROSS_COMPILE="$(pwd)/$GCC_DIR/aarch64-linux-gnu-"
            echo "✅ 使用预编译 GCC: $CROSS_COMPILE"
          else
            export CROSS_COMPILE="aarch64-linux-gnu-"
            echo "⚠️ 使用系统 GCC"
          fi

          export PATH="$CLANG_DIR:${LLD_DIR:-/usr/bin}:$GCC_DIR:/usr/lib/ccache:$PATH"

          echo "📋 编译器版本:"
          clang --version | head -1
          ld.lld --version 2>/dev/null || echo "⚠️ ld.lld 版本检查失败"
          ${CROSS_COMPILE}gcc --version 2>/dev/null | head -1 || echo "⚠️ 交叉编译器未找到"

          echo ""
          echo "🔧 步骤1: 配置 common 内核..."
          cd common

          # 添加自定义配置到 defconfig
          CUSTOM_CFG='${{ github.event.inputs.CUSTOM_CONFIG }}'
          echo "$CUSTOM_CFG" | tr ',' '\n' | grep -v '^$' >> arch/arm64/configs/gki_defconfig

          # 禁用 OPLUS 闭源驱动 (避免编译问题)
          ./scripts/config --file arch/arm64/configs/gki_defconfig \
            --disable CONFIG_OPLUS_BUG_STABILITY \
            --disable CONFIG_OPLUS_FEATURE_DEXOPT_STRATEGY \
            --disable CONFIG_OPLUS_FEATURE_THEIA \
            --disable CONFIG_OPLUS_BINDER_STRATEGY \
            --disable CONFIG_OPLUS_FEATURE_HEALTHINFO || true

          echo ""
          echo "🔧 步骤2: 编译 common 内核镜像 + 模块..."
          make -j$(nproc --all) \
            LLVM=1 \
            ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            CROSS_COMPILE=${CROSS_COMPILE} \
            O=out \
            gki_defconfig all 2>&1 | tee ../build_common.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ common 内核编译失败"
            echo "=== 错误信息 ==="
            grep -E "(Error|error:|FAILED|fatal)" ../build_common.log | tail -20
            exit 1
          fi

          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ common 内核编译成功!"
            echo "📦 Image 大小: $(du -h out/arch/arm64/boot/Image | cut -f1)"
          fi

          echo ""
          echo "🔧 步骤3: 编译设备树 (DTB)..."
          cd ../msm-kernel

          # 配置 msm-kernel defconfig
          echo "$CUSTOM_CFG" | tr ',' '\n' | grep -v '^$' >> arch/arm64/configs/vendor/sun-gki.config 2>/dev/null || \
          echo "$CUSTOM_CFG" | tr ',' '\n' | grep -v '^$' >> arch/arm64/configs/gki_defconfig 2>/dev/null || true

          # 尝试编译设备树
          make -j$(nproc --all) \
            LLVM=1 \
            ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            CROSS_COMPILE=${CROSS_COMPILE} \
            O=out \
            dtbs 2>&1 | tee ../build_dtb.log || echo "⚠️ DTB 编译失败，可能需要 vendor 配置"

          echo ""
          echo "🔧 步骤4: 编译 msm-kernel 设备驱动模块..."
          make -j$(nproc --all) \
            LLVM=1 \
            ARCH=arm64 \
            CC="ccache clang" \
            LD=ld.lld \
            CROSS_COMPILE=${CROSS_COMPILE} \
            O=out \
            KBUILD_MIXED_TREE=../common \
            modules 2>&1 | tee ../build_modules.log || echo "⚠️ 模块编译失败"

          echo ""
          ccache -s

      - name: "📦 Collect Build Artifacts"
        run: |
          cd kernel_workspace/kernel_platform

          echo "📋 收集构建产物..."
          echo ""

          mkdir -p Final-Image

          # 复制 Image (从 common)
          if [ -f "common/out/arch/arm64/boot/Image" ]; then
            cp common/out/arch/arm64/boot/Image Final-Image/Image
            echo "✅ Image 已复制 ($(du -h common/out/arch/arm64/boot/Image | cut -f1))"
          fi

          if [ -f "common/out/arch/arm64/boot/Image.gz" ]; then
            cp common/out/arch/arm64/boot/Image.gz Final-Image/Image.gz
            echo "✅ Image.gz 已复制 ($(du -h common/out/arch/arm64/boot/Image.gz | cut -f1))"
          fi

          if [ -f "common/out/arch/arm64/boot/Image.lz4" ]; then
            cp common/out/arch/arm64/boot/Image.lz4 Final-Image/Image.lz4
            echo "✅ Image.lz4 已复制 ($(du -h common/out/arch/arm64/boot/Image.lz4 | cut -f1))"
          fi

          # 复制 DTB (从 msm-kernel)
          if [ -d "msm-kernel/out/arch/arm64/boot/dts" ]; then
            mkdir -p Final-Image/dts
            find msm-kernel/out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} Final-Image/dts/ \; 2>/dev/null
            find msm-kernel/out/arch/arm64/boot/dts -name "*.dtbo" -exec cp {} Final-Image/dts/ \; 2>/dev/null
            DTB_COUNT=$(find Final-Image/dts -type f 2>/dev/null | wc -l)
            echo "✅ DTB/DTBO 已复制 ($DTB_COUNT 个文件)"
          fi

          # 复制内核模块 (.ko)
          echo ""
          echo "📦 收集内核模块..."
          KO_COUNT=$(find common/out msm-kernel/out -name "*.ko" -type f 2>/dev/null | wc -l)
          if [ "$KO_COUNT" -gt 0 ]; then
            mkdir -p Final-Image/modules
            find common/out msm-kernel/out -name "*.ko" -exec cp {} Final-Image/modules/ \; 2>/dev/null
            echo "✅ 已复制 $KO_COUNT 个 .ko 文件"
          else
            echo "⚠️ 未找到 .ko 文件"
          fi

          # 复制配置文件
          if [ -f "common/out/.config" ]; then
            cp common/out/.config Final-Image/kernel.config
            echo "✅ kernel.config 已复制"
          fi

          echo ""
          echo "📦 最终产物:"
          ls -lh Final-Image/
          echo ""
          du -sh Final-Image/* 2>/dev/null

      - name: "📋 Verify Custom Config"
        run: |
          cd kernel_workspace/kernel_platform

          if [ -f "Final-Image/kernel.config" ]; then
            echo "📋 检查自定义内核配置是否生效..."
            IFS=',' read -ra CFG_ARRAY <<< '${{ github.event.inputs.CUSTOM_CONFIG }}'
            for item in "${CFG_ARRAY[@]}"; do
              [ -z "$item" ] && continue
              cfg=$(echo "$item" | cut -d= -f1)
              result=$(grep "^$cfg=" Final-Image/kernel.config 2>/dev/null || grep "# $cfg is not set" Final-Image/kernel.config 2>/dev/null || echo "NOT FOUND")
              echo "  $result"
            done
          else
            echo "⚠️ kernel.config 不存在，跳过检查"
          fi

      - name: "📤 Upload Kernel Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: kernel_pad2pro_bazel_official
          path: kernel_workspace/kernel_platform/Final-Image/
          retention-days: 7

      - name: "📤 Upload Build Log (on failure)"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build_log_pad2pro_bazel
          path: kernel_workspace/kernel_platform/build.log
          retention-days: 3
