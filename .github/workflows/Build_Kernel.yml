name: OnePlus Pad 2 Pro (Official - Bazel)

on:
  workflow_dispatch:
    inputs:
      CUSTOM_CONFIG:
        description: "自定义内核配置选项 (逗号分隔)"
        required: false
        type: string
        default: "CONFIG_SYSVIPC=y,CONFIG_POSIX_MQUEUE=y,CONFIG_IPC_NS=y,CONFIG_PID_NS=y"

jobs:
  build:
    name: Build Kernel via Bazel/Kleaf
    runs-on: ubuntu-latest
    timeout-minutes: 480

    env:
      CCACHE_MAXSIZE: 8G

    steps:
      - name: "🚀 Maximize Build Space"
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 24576
          temp-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "📦 Cache & Install Dependencies"
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev zlib1g-dev rsync unzip gawk dos2unix bc openjdk-17-jdk
          execute_install_scripts: true

      - name: "📥 Install Repo Tool"
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          echo "✅ repo 工具安装完成"

      - name: "📥 Init & Sync All Repos"
        run: |
          echo "📋 初始化仓库清单..."
          mkdir kernel_workspace && cd kernel_workspace

          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git \
                    -b oneplus/sm8750 \
                    -m oneplus_pad_2_pro_b.xml \
                    --depth=1

          echo "🔄 同步所有仓库 (约 35 个)..."
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

          echo "✅ 仓库同步完成"
          echo ""
          echo "📂 工作区结构:"
          ls -la
          echo ""
          echo "📂 kernel_platform:"
          ls -la kernel_platform/
          echo ""
          echo "📂 prebuilts/clang:"
          ls kernel_platform/prebuilts/clang/host/linux-x86/ 2>/dev/null | head -10
          echo ""
          echo "📂 build:"
          ls kernel_platform/build/ 2>/dev/null

      - name: "🔍 Check Build Dependencies"
        run: |
          cd kernel_workspace

          echo "📋 检查关键文件和目录..."
          echo ""
          echo "--- build/build.sh ---"
          ls -la kernel_platform/build/build.sh 2>/dev/null || echo "⚠️ build.sh 不存在"

          echo ""
          echo "--- build/kernel/kleaf ---"
          ls kernel_platform/build/kernel/kleaf/ 2>/dev/null | head -10 || echo "⚠️ kleaf 不存在"

          echo ""
          echo "--- build/config.sh ---"
          ls kernel_platform/build/config.sh 2>/dev/null || echo "⚠️ config.sh 不存在"

          echo ""
          echo "--- msm-kernel build.config.msm.sun ---"
          ls kernel_platform/msm-kernel/build.config.msm.sun 2>/dev/null || echo "⚠️ 不存在"

          echo ""
          echo "--- defconfig ---"
          ls kernel_platform/msm-kernel/arch/arm64/configs/ 2>/dev/null | head -10

      - name: "🔧 Setup Cache Env"
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_pad2pro" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_pad2pro"

      - name: "💾 Restore ccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-bazel-${{ runner.os }}-pad2pro-${{ github.run_id }}
          restore-keys: |
            ccache-bazel-${{ runner.os }}-pad2pro

      - name: "⚙️ Initialize ccache"
        run: |
          mkdir -p "${{ env.CCACHE_DIR }}"
          ccache -M ${{ env.CCACHE_MAXSIZE }}
          ccache -s

      - name: "🔧 Apply Custom Kernel Config"
        run: |
          cd kernel_workspace/kernel_platform

          echo "📋 添加自定义内核配置..."
          echo '${{ github.event.inputs.CUSTOM_CONFIG }}' | tr ',' '\n' | grep -v '^$' >> msm-kernel/arch/arm64/configs/gki_defconfig

          echo "✅ 已追加的配置:"
          echo '${{ github.event.inputs.CUSTOM_CONFIG }}' | tr ',' '\n' | grep -v '^$'

          echo ""
          echo "📋 检查 gki_defconfig 末尾:"
          tail -10 msm-kernel/arch/arm64/configs/gki_defconfig

      - name: "🔨 Build Kernel via Bazel/Kleaf"
        run: |
          cd kernel_workspace/kernel_platform

          echo "🔧 设置环境变量..."
          export KBUILD_BUILD_USER="OnePlus"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          echo "🔧 检查构建系统..."
          if [ -f "build/build.sh" ]; then
            echo "✅ 使用 build/build.sh (Kleaf)"
            BUILD_CMD="build/build.sh"
          elif [ -f "msm-kernel/build_with_bazel.py" ]; then
            echo "✅ 使用 build_with_bazel.py"
            BUILD_CMD="python3 msm-kernel/build_with_bazel.py"
          else
            echo "❌ 找不到构建系统"
            ls build/ 2>/dev/null
            exit 1
          fi

          echo ""
          echo "🔧 开始构建内核..."
          echo "📋 目标: sun (sm8750) gki"

          if [ "$BUILD_CMD" = "build/build.sh" ]; then
            # 使用 build.sh (Kleaf)
            BUILD_BOOT_IMG=1 \
            BUILD_INITRAMFS=1 \
            BUILD_VENDOR_DLKM=1 \
            LTO=thin \
            build/build.sh \
              --dist_dir=dist \
              --target=msm.sun \
              --variant=gki \
              2>&1 | tee build.log
          else
            # 使用 build_with_bazel.py
            python3 msm-kernel/build_with_bazel.py \
              -t sun gki \
              2>&1 | tee build.log
          fi

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "❌ 构建失败"
            echo "=== 错误信息 ==="
            grep -E "(Error|error:|FAILED|fatal)" build.log | tail -30
            echo ""
            echo "=== 最后 50 行 ==="
            tail -50 build.log
            exit 1
          fi

      - name: "📦 Collect Build Artifacts"
        run: |
          cd kernel_workspace/kernel_platform

          echo "📋 搜索构建产物..."
          echo ""

          echo "--- 搜索 Image ---"
          find . -name "Image" -path "*/boot/*" -type f 2>/dev/null
          find dist -name "Image*" -type f 2>/dev/null

          echo ""
          echo "--- 搜索 DTB ---"
          find . -name "*.dtb" -type f 2>/dev/null | head -20

          echo ""
          echo "--- 搜索 .ko ---"
          find . -name "*.ko" -type f 2>/dev/null | wc -l

          echo ""
          echo "--- dist 目录 ---"
          ls -la dist/ 2>/dev/null || echo "dist 目录不存在"

          echo ""
          mkdir -p Final-Image

          # 复制 Image
          for img in $(find . -name "Image" -path "*/boot/*" -type f 2>/dev/null | head -1); do
            cp "$img" Final-Image/Image
            echo "✅ Image 已复制: $img"
          done

          # 从 dist 复制
          if [ -d "dist" ]; then
            cp dist/Image* Final-Image/ 2>/dev/null || true
            cp dist/*.ko Final-Image/ 2>/dev/null || true
            cp dist/*.dtb* Final-Image/ 2>/dev/null || true
            cp dist/*.dtbo* Final-Image/ 2>/dev/null || true
          fi

          # 复制 DTB
          if [ -d "dist/arch/arm64/boot/dts" ]; then
            mkdir -p Final-Image/dts
            find dist/arch/arm64/boot/dts -name "*.dtb" -exec cp {} Final-Image/dts/ \; 2>/dev/null
            find dist/arch/arm64/boot/dts -name "*.dtbo" -exec cp {} Final-Image/dts/ \; 2>/dev/null
          fi

          # 复制模块
          KO_COUNT=$(find . -name "*.ko" -type f 2>/dev/null | wc -l)
          if [ "$KO_COUNT" -gt 0 ]; then
            mkdir -p Final-Image/modules
            find . -name "*.ko" -exec cp --parents {} Final-Image/modules/ \; 2>/dev/null
            echo "✅ 已复制 $KO_COUNT 个 .ko 文件"
          fi

          # 复制配置文件
          for cfg in msm-kernel/out/.config common/out/.config; do
            if [ -f "$cfg" ]; then
              cp "$cfg" Final-Image/kernel.config
              echo "✅ kernel.config 已复制"
              break
            fi
          done

          echo ""
          echo "📦 最终产物:"
          ls -lh Final-Image/
          echo ""
          du -sh Final-Image/* 2>/dev/null

      - name: "📋 Verify Custom Config"
        run: |
          cd kernel_workspace/kernel_platform

          if [ -f "Final-Image/kernel.config" ]; then
            echo "📋 检查自定义内核配置是否生效..."
            IFS=',' read -ra CFG_ARRAY <<< '${{ github.event.inputs.CUSTOM_CONFIG }}'
            for item in "${CFG_ARRAY[@]}"; do
              [ -z "$item" ] && continue
              cfg=$(echo "$item" | cut -d= -f1)
              result=$(grep "^$cfg=" Final-Image/kernel.config 2>/dev/null || grep "# $cfg is not set" Final-Image/kernel.config 2>/dev/null || echo "NOT FOUND")
              echo "  $result"
            done
          else
            echo "⚠️ kernel.config 不存在，跳过检查"
          fi

      - name: "📤 Upload Kernel Artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: kernel_pad2pro_bazel_official
          path: kernel_workspace/kernel_platform/Final-Image/
          retention-days: 7

      - name: "📤 Upload Build Log (on failure)"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build_log_pad2pro_bazel
          path: kernel_workspace/kernel_platform/build.log
          retention-days: 3
